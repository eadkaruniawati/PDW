<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akademi Destinasi Wisata</title>
<style>
:root{
  --navy:#1F3864; --navy-m:#2C4E7A; --navy-d:#16294A;
  --emas:#C9A227; --emas-l:#EFE0AE; --emas-t:#8A6F16;
  --tajuk:#1F3864; --ice:#EAF0F6; --ground:#FAF5E8; --permukaan:#FFFFFF; --tepi2:#E4D9BE;
  --tinta:#1A1A1A; --redup:#5A6472; --garis:#C8D3E2;
  --hijau:#2F6B44; --hijau-l:#E6F0E8; --merah:#A4553A; --merah-l:#F6E4DE;
  --sorot:#FBEFD6; --kunci:#8C93A0;
  --judul-f:Cambria,"Bookman Old Style",Georgia,serif;
  --isi-f:Calibri,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tajuk:#A9C6F2; --ice:#1E2A3B; --ground:#121821; --permukaan:#1B2330; --tepi2:#333E52;
    --tinta:#E8EDF5; --redup:#9AA8BC; --garis:#2E3A4D; --emas:#D9B64A; --emas-l:#4A3F1C;
    --emas-t:#D9B64A; --hijau:#7FBF96; --hijau-l:#1E3326; --merah:#D79A80; --merah-l:#3A2620;
    --sorot:#2E2A16; --kunci:#6C778A;
  }
}
:root[data-theme="dark"]{
  --tajuk:#A9C6F2; --ice:#1E2A3B; --ground:#121821; --permukaan:#1B2330; --tepi2:#333E52;
  --tinta:#E8EDF5; --redup:#9AA8BC; --garis:#2E3A4D; --emas:#D9B64A; --emas-l:#4A3F1C;
  --emas-t:#D9B64A; --hijau:#7FBF96; --hijau-l:#1E3326; --merah:#D79A80; --merah-l:#3A2620;
  --sorot:#2E2A16; --kunci:#6C778A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--isi-f);font-size:16px;line-height:1.6;color:var(--tinta);background:var(--ground)}
h1,h2,h3,h4{font-family:var(--judul-f);color:var(--tajuk);margin:0 0 .5rem;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.2}
h2{font-size:1.35rem;margin-top:1.9rem}
h3{font-size:1.08rem;margin-top:1.3rem}
.kicker{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--emas-t);margin-bottom:.3rem}

/* ── bilah atas ── */
.bilah{position:sticky;top:0;z-index:20;background:var(--navy);color:#E4EDF9;
  padding:.55rem clamp(12px,3vw,26px);padding-top:calc(.55rem + env(safe-area-inset-top,0px));
  display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--emas)}
.bilah .nama{font-family:var(--judul-f);font-weight:700;font-size:1.02rem;color:#fff;line-height:1.15}
.bilah .nama span{display:block;font-family:var(--isi-f);font-size:.68rem;letter-spacing:.12em;color:#93A8C7;font-weight:400}
.pangkat{display:flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.1);border:1px solid rgba(201,162,39,.55);
  border-radius:99px;padding:.18rem .7rem;font-size:.82rem;white-space:nowrap}
.pangkat b{color:var(--emas-l);font-family:var(--judul-f)}
.xpbar{flex:1 1 200px;min-width:160px}
.xpbar .rel{height:12px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.xpbar .rel i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C9A227,#EFE0AE);transition:width .4s}
.xpbar small{display:block;font-size:.72rem;color:#BFD0E8;margin-top:.15rem;font-variant-numeric:tabular-nums}
.bilah button{font:inherit;font-size:.8rem;background:rgba(255,255,255,.12);color:#E4EDF9;border:0;
  border-radius:7px;padding:.28rem .6rem;cursor:pointer}
.bilah button:hover{background:rgba(255,255,255,.22)}

/* ── tata letak ── */
.bungkus{display:flex;align-items:flex-start}
nav{width:248px;flex:0 0 248px;background:var(--navy-d);color:#C6D4E8;padding:.9rem 0 2.5rem;
  position:sticky;top:64px;max-height:calc(100vh - 64px);overflow-y:auto}
nav .kel{padding:.85rem 1.05rem .25rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--emas)}
nav button{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;background:none;border:0;
  color:#C6D4E8;font:inherit;font-size:.87rem;padding:.4rem 1.05rem;cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:rgba(255,255,255,.07)}
nav button:focus-visible{outline:2px solid var(--emas);outline-offset:-2px}
nav button.aktif{background:rgba(255,255,255,.13);border-left-color:var(--emas);color:#fff;font-weight:600}
nav button.terkunci{color:var(--kunci)}
nav .tanda{flex:0 0 1.05rem;text-align:center;font-size:.78rem}
main{flex:1;min-width:0;padding-inline:clamp(16px,4vw,44px);padding-block:1.6rem 5rem;background:var(--ground)}
.halaman{display:none;max-width:980px;margin:0 auto}
.halaman.tampil{display:block}
.garis-emas{width:66px;height:3px;background:var(--emas);margin:.5rem 0 1rem}

/* ── komponen ── */
.kartu{background:var(--permukaan);border:1px solid var(--garis);border-radius:11px;padding:1rem 1.2rem;margin:.95rem 0}
.kartu.ice{background:var(--ice)}
.kartu.krem{background:var(--ground);border-color:var(--tepi2)}
.kartu.navy{background:var(--navy);border-color:var(--navy);color:#E4EDF9}
.kartu.navy h3{color:#fff}
.kartu.navy .kicker{color:var(--emas-l)}
.pita{border-left:5px solid var(--emas)}
.pita-navy{border-left:5px solid var(--navy)}
.kisi2{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:.85rem}
.kisi3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.85rem}
.kisi4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
ol.num{padding-left:0;list-style:none;margin:.5rem 0;counter-reset:n}
ol.num li{position:relative;padding-left:1.9rem;margin-bottom:.45rem}
ol.num li::before{counter-increment:n;content:counter(n);position:absolute;left:0;top:.14rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--emas);color:#1F3864;font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.gulir{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:.75rem 0;font-size:.91rem;background:var(--permukaan)}
th,td{border:1px solid var(--garis);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-family:var(--judul-f)}
tbody tr:nth-child(even){background:var(--ice)}
.lencana-chip{display:inline-block;background:var(--emas-l);color:var(--tajuk);border-radius:6px;padding:.08rem .5rem;font-size:.76rem;font-weight:700}
.redup{color:var(--redup)}
.kecil{font-size:.85rem}
.xp{display:inline-block;background:var(--emas);color:#1F3864;border-radius:6px;padding:.05rem .45rem;
  font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:.92rem;width:100%;padding:.4rem .5rem;
  border:1px solid var(--garis);border-radius:7px;background:var(--ground);color:var(--tinta)}
textarea{min-height:4.6rem;resize:vertical}
input[type=range]{width:100%;accent-color:var(--navy)}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.opsi:focus-visible{outline:2px solid var(--emas);outline-offset:2px}
button.tombol{font:inherit;font-size:.9rem;font-weight:600;border:0;border-radius:8px;padding:.5rem 1rem;cursor:pointer;background:var(--navy);color:#fff}
button.tombol.kedua{background:var(--emas-l);color:var(--tajuk);border:1px solid var(--emas)}
button.tombol[disabled]{opacity:.45;cursor:not-allowed}
button.tombol:hover:not([disabled]){filter:brightness(1.12)}
.deret{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-top:.8rem}
.hasil{font-family:var(--judul-f);font-size:1.5rem;font-weight:700;color:var(--tajuk);font-variant-numeric:tabular-nums}
.peringatan{background:var(--sorot);border-left:5px solid var(--emas);padding:.65rem .85rem;border-radius:0 7px 7px 0;margin:.65rem 0;font-size:.91rem}
.bar{height:11px;background:var(--ice);border-radius:99px;overflow:hidden;margin:.4rem 0}
.bar i{display:block;height:100%;background:var(--emas);width:0;transition:width .3s}
.soal{border:1px solid var(--garis);border-radius:10px;background:var(--permukaan);padding:.85rem 1rem;margin:.75rem 0}
.soal .tanya{font-weight:600;margin-bottom:.5rem}
.opsi{display:block;width:100%;text-align:left;font:inherit;border:1px solid var(--garis);border-radius:8px;
  padding:.45rem .65rem;margin:.28rem 0;cursor:pointer;font-size:.92rem;background:var(--ground);color:var(--tinta)}
.opsi:hover:not(.mati){background:var(--ice)}
.opsi.benar{background:var(--hijau-l);border-color:var(--hijau);font-weight:600}
.opsi.salah{background:var(--merah-l);border-color:var(--merah)}
.opsi.mati{cursor:default}
.bahas{font-size:.87rem;color:var(--redup);font-style:italic;margin-top:.45rem;border-top:1px dashed var(--garis);padding-top:.45rem}
.gerbang{background:var(--permukaan);border:2px dashed var(--emas);border-radius:12px;padding:1.6rem 1.3rem;text-align:center;margin:1.4rem 0}
.gerbang .gembok{font-size:2rem;line-height:1}
.plot{width:100%;max-width:520px;height:auto;border:1px solid var(--garis);border-radius:9px;background:#fff}
.lencana-kartu{border:1px solid var(--garis);border-radius:11px;padding:.85rem .95rem;background:var(--permukaan)}
.lencana-kartu.mati{opacity:.5;background:var(--ice)}
.lencana-kartu .pin{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--emas);color:#1F3864;
  display:flex;align-items:center;justify-content:center;font-family:var(--judul-f);font-weight:700;margin-bottom:.4rem}
.lencana-kartu.mati .pin{background:var(--garis);color:var(--redup)}
.sertifikat{background:var(--permukaan);border:3px double var(--navy);border-radius:6px;padding:2.1rem 1.8rem;text-align:center;margin:1.1rem 0}
.sertifikat .pita-atas{width:100%;height:5px;background:var(--emas);margin-bottom:1.3rem}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:.7rem;margin:1.1rem 0}
.stat div{background:var(--ice);border-radius:9px;padding:.6rem}
.stat b{display:block;font-family:var(--judul-f);font-size:1.3rem;color:var(--tajuk);font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--redup)}
.roda-bungkus{display:flex;gap:1.1rem;flex-wrap:wrap;align-items:flex-start}
.roda{transition:transform 3.4s cubic-bezier(.17,.67,.21,1)}
#tbl-nav{display:none}
@media (max-width:880px){
  .bungkus{flex-direction:column}
  #tbl-nav{display:inline-block}
  nav{width:100%;flex:none;position:static;max-height:none;display:none;flex-wrap:wrap;padding:.5rem 0 .8rem}
  nav.buka{display:flex}
  nav .kel{width:100%}
  nav button{width:auto;border-left:0;border-bottom:3px solid transparent;border-radius:0}
  nav button.aktif{border-left:0;border-bottom-color:var(--emas)}
  main{padding-block:1.2rem 3.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.roda{transition:none!important}}
@media print{.bilah,nav,.tombol{display:none}main{padding:0}.halaman{display:none}.halaman.tampil{display:block}body{background:#fff}}
</style>
</head>
<body>

<script>
const D = {"MODUL":[{"no":1,"mg":"Minggu 1","judul":"Objek Wisata, Daya Tarik Wisata, dan Destinasi","sub":"Sub-CPMK-1: Menjelaskan dan membedakan objek wisata, daya tarik wisata, dan destinasi wisata.","ind":["Ketepatan menjelaskan pengertian objek/daya tarik wisata dan destinasi wisata.","Ketepatan membedakan ketiga konsep beserta implikasi pengelolaannya.","Ketepatan pertimbangan dalam memilih daya tarik wisata jangkar untuk proyek semester."],"bk":"BK-1 — Konsep objek wisata, daya tarik wisata, dan destinasi wisata; kedudukan pengelolaan destinasi dalam sistem kepariwisataan.","bobot":3,"poin":[["Objek wisata","Benda atau tempatnya sendiri — air terjun, candi, pantai. Ia ada tanpa perlu ada yang mengelola."],["Daya tarik wisata","Objek yang sudah punya keunikan, keindahan, dan nilai yang menjadi sasaran kunjungan. Sudah ada niat menarik orang."],["Destinasi pariwisata","Kawasan geografis yang di dalamnya terdapat daya tarik, fasilitas umum, fasilitas pariwisata, aksesibilitas, dan masyarakat yang saling terkait."]],"pustaka":["Pustaka 10 — UU 10/2009 Pasal 1 dan Pasal 7","Pustaka 12 — Perda Kepri 2/2012 Pasal 1","Pustaka 13 — Perda Bintan 4/2015 Pasal 1","Pustaka 3 — UNWTO §1.1 hlm. 1–2","Pustaka 1 — Morrison Bab 1","Pustaka 4 — Cooper Bab 2"],"alat":"Bank soal kuis konsep dasar","catatan":"Formulir pendaftaran DTW jangkar ditutup pada akhir pertemuan. Kelompok yang belum menetapkan tidak bisa memulai Tugas-1.","tugas":{"judul":"Yang dikerjakan setelah kelas ini","isi":["Tetapkan satu DTW jangkar kelompok di Bintan atau Kepulauan Riau.","Periksa kelayakannya dengan Perda Kepri 2/2012 Pasal 12 dan Perda Bintan 4/2015 Pasal 12–13.","Pastikan bisa didatangi berulang, ada yang bisa diwawancarai, dan ada yang bisa dihitung.","Daftarkan pilihan kelompok melalui LMS."],"catatan":"Pilihan ini tidak bisa diganti di tengah semester."},"latihan":[{"bl":1,"s":"Air terjun di pedalaman Bintan itu belum berpapan penunjuk, belum berloket, dan tidak ada yang menjaganya — tetapi sudah sesekali didatangi orang. Statusnya paling tepat disebut","p":["Objek wisata","Daya tarik wisata","Destinasi pariwisata","Kawasan strategis pariwisata"],"k":"A","b":"Belum ada pihak yang berniat mendatangkan orang ke sana. Selama niat itu belum ada, ia baru sebuah objek — dan karena itu belum ada kewajiban pengelolaan yang melekat padanya."},{"bl":1,"s":"Kelompok memilih daya tarik wisata jangkar yang hanya sanggup mereka datangi satu kali sepanjang semester. Tindakan yang paling tepat adalah","p":["Tetap lanjut, data kekurangan dilengkapi dari internet","Ganti pilihan pada minggu pertama juga","Tetap lanjut, tetapi minta perpanjangan waktu","Bagi kelompok menjadi dua supaya ada yang bisa ke sana"],"k":"B","b":"Tugas-6 menuntut pengukuran sendiri di lapangan dan Tugas-3 menuntut wawancara. Keduanya tidak bisa dikerjakan dari jauh. Pilihan jangkar tidak bisa diganti setelah minggu pertama, jadi inilah saat menggantinya."}]},{"no":2,"mg":"Minggu 2–3","judul":"Tipologi dan Risiko Pengelolaan Daya Tarik Wisata","sub":"Sub-CPMK-2: Mengklasifikasikan jenis daya tarik wisata dan menganalisis karakteristik serta risiko pengelolaannya.","ind":["Ketepatan mengklasifikasikan daya tarik wisata alam, budaya, dan buatan.","Ketajaman menganalisis perbedaan karakteristik dan risiko pengelolaan tiap jenis.","Kelengkapan dan keterverifikasian data profil daya tarik wisata jangkar."],"bk":"BK-2 — Tipologi daya tarik wisata; karakteristik dan risiko pengelolaan daya tarik alam, budaya, dan buatan.","bobot":7,"poin":[["Daya tarik wisata alam","Bersumber dari bentang alam dan kehidupan di dalamnya. Sumber dayanya tidak bisa diproduksi ulang bila rusak."],["Daya tarik wisata budaya","Bersumber dari hasil karya dan kehidupan manusia. Pemiliknya adalah komunitas, bukan pengelola."],["Daya tarik wisata hasil buatan manusia","Sengaja dibangun untuk menarik kunjungan. Bisa diperbarui, tetapi menuntut investasi berkelanjutan."]],"pustaka":["Pustaka 12 — Perda Kepri 2/2012 Pasal 17–18","Pustaka 13 — Perda Bintan 4/2015 BAB IV Bagian Keempat","Pustaka 1 — Morrison Bab 5","Pustaka 4 — Cooper Bab 7","Pustaka 3 — UNWTO §5.7 hlm. 98–102","Pustaka 15, 16, 6 — kajian berlatar Bintan dan Lagoi","Pustaka 7 — Teguh hlm. 279–282"],"alat":"Repositori data daya tarik wisata","catatan":"Papan Padlet disimpan; pada minggu 11–12 dibuka lagi untuk memeriksa apakah penggolongan awal masih bertahan setelah mahasiswa mengenal destinasinya lebih dalam.","tugas":{"judul":"Tugas-1 — Profil Klasifikasi Daya Tarik Wisata","isi":["Individu, 800–1.000 kata, dikumpulkan pertemuan ke-3.","Isi: klasifikasi jenis, sumber daya inti, pengelola, pola kunjungan, risiko khas jenis itu.","Wajib memuat data primer hasil observasi sendiri.","Sekurang-kurangnya tiga sumber sekunder yang dapat diverifikasi."],"catatan":"Dinilai dengan rubrik D.1. Bacalah rubriknya sebelum menulis."},"latihan":[{"bl":2,"s":"Sebuah kampung pesisir menjual pertunjukan tari dan juga menyewakan kano di hutan mangrovenya. Dalam laporan, jenis daya tarik wisatanya sebaiknya","p":["Ditulis \"campuran\" tanpa penjelasan lebih lanjut","Ditulis ketiganya sekaligus supaya lengkap","Ditetapkan yang dominan, dengan alasan yang bisa diperiksa","Ditetapkan mengikuti jenis yang paling banyak pengunjungnya"],"k":"C","b":"Banyak daya tarik memang campuran. Yang dinilai bukan ketepatan label, melainkan kemampuan menetapkan jenis dominan dan mempertanggungjawabkannya — sebab jenis dominan itulah yang menentukan risiko mana yang paling perlu dijaga."},{"bl":2,"s":"Sebuah taman rekreasi buatan sepi setelah lima tahun beroperasi, padahal bangunannya masih baik. Risiko yang paling mungkin sedang bekerja adalah","p":["Kerusakan sumber daya yang tidak bisa pulih","Komodifikasi dan hilangnya makna","Kebosanan pasar","Konflik kepemilikan lahan"],"k":"C","b":"Daya tarik buatan bisa diperbarui, tetapi menuntut investasi berkelanjutan. Tanpa penambahan yang benar-benar baru, pasarnya jenuh lebih dahulu daripada bangunannya."}]},{"no":3,"mg":"Minggu 4–5","judul":"Komponen 6A dan Siklus Hidup Destinasi","sub":"Sub-CPMK-3: Menganalisis kelengkapan komponen destinasi (6A) dan menentukan posisi destinasi dalam siklus hidup destinasi.","ind":["Kelengkapan audit komponen 6A pada DTW jangkar.","Ketepatan penentuan posisi tahap TALC disertai bukti pendukung.","Ketajaman menyimpulkan implikasi pengelolaan dari hasil audit."],"bk":"BK-3, BK-4 — Komponen destinasi 6A dan keterkaitannya; siklus hidup destinasi dan implikasi tiap tahap.","bobot":8,"poin":[["Attractions · Accessibility","Yang membuat orang mau datang, dan yang membuat mereka bisa sampai — rute, terminal, moda."],["Amenities · Ancillary services","Yang membuat mereka betah: akomodasi, jasa boga, ritel; dan yang menopang diam-diam: bank, sinyal, layanan kesehatan."],["Available packages · Activities","Apakah destinasi ini bisa dibeli sebagai produk, dan apa yang benar-benar dikerjakan orang selama di sana."]],"pustaka":["Pustaka 5 — Buhalis 2000 Tabel 1 (kerangka enam A)","Pustaka 8 — Butler 1980 Figure 1 hlm. 7 dan hlm. 7–9","Pustaka 1 — Morrison Figure 1.8 (pembanding sepuluh A)","Pustaka 3 — UNWTO §1.6 hlm. 16","Pustaka 4 — Cooper Bab 2 (The Evolving Destination)","Pustaka 12 Pasal 12 dan 18 · Pustaka 13 Pasal 12–13 dan Lampiran I"],"alat":"Lembar Audit Komponen 6A · Penentu Tahap Siklus Hidup Destinasi","catatan":"Alat penentu tahap sengaja tidak memberi jawaban tunggal bila bukti terbagi. Tegaskan bahwa itu bukan kerusakan alat, melainkan gambaran destinasi yang memang sedang berpindah tahap.","tugas":{"judul":"Tugas-2 — Audit 6A dan Penentuan Posisi TALC","isi":["Kelompok. Keluaran: matriks audit, argumen penentuan tahap, presentasi 10 menit.","Pakai LK-1 (lembar audit 6A) dan LK-2 (lembar posisi TALC).","Tiga jenis bukti wajib: tren kunjungan, kondisi fasilitas, pola investasi.","Tutup dengan uji silang terhadap Perda Kepri Pasal 12 dan Perda Bintan Pasal 12–13."],"catatan":"Destinasi boleh menunjukkan ciri dua tahap sekaligus — jangan dipaksakan menjadi satu."},"latihan":[{"bl":3,"s":"Hasil audit menunjukkan attractions bernilai 2, accessibility 1, amenities 1, available packages 0, activities 0, dan ancillary services 1. Kesimpulan yang paling jujur adalah","p":["Destinasi ini sudah siap dipasarkan lebih gencar","Daya tariknya kuat, tetapi penopangnya lemah","Daya tariknya lemah dan perlu dibangun ulang","Nilainya terlalu rendah untuk disimpulkan"],"k":"B","b":"Jumlahnya 5 dari 12. Pola seperti ini khas: yang menarik orang sudah ada, yang menahan mereka tinggal belum. Menambah promosi pada keadaan ini justru memperlebar jarak antara janji dan kenyataan."},{"bl":3,"s":"Bukti lapangan kelompok menunjuk tiga ciri konsolidasi dan tiga ciri stagnasi sekaligus. Jawaban yang benar adalah","p":["Pilih tahap yang cirinya lebih meyakinkan","Kumpulkan bukti tambahan sampai salah satu menang","Nyatakan destinasi sedang berpindah tahap, sertakan kedua buktinya","Ulangi pengamatan pada musim yang berbeda"],"k":"C","b":"Bukti yang terbagi bukan kegagalan pengamatan. Masa perpindahan tahap justru saat keputusan pengelolaan paling menentukan — dan menyebutkannya lebih berharga daripada memaksa satu label."}]},{"no":4,"mg":"Minggu 6–7","judul":"Tata Kelola Destinasi dan Pemangku Kepentingan","sub":"Sub-CPMK-4: Menganalisis struktur, fungsi, dan payung regulasi organisasi pengelola destinasi (DMO). Sub-CPMK-5: Memetakan pemangku kepentingan pentahelix beserta kepentingan, pengaruh, dan potensi konfliknya.","ind":["Ketepatan menguraikan bentuk, fungsi, dan dasar hukum organisasi pengelola destinasi.","Ketajaman mengidentifikasi kesenjangan kelembagaan pada destinasi yang dikaji.","Kelengkapan identifikasi dan ketepatan penempatan pemangku kepentingan pada matriks kepentingan-pengaruh.","Ketajaman mengenali potensi konflik serta kepekaan terhadap kepentingan masyarakat lokal."],"bk":"BK-5, BK-6 — Tata kelola destinasi; DMO dan DMP; regulasi kepariwisataan nasional dan daerah; pentahelix; kemitraan dan resolusi konflik kepentingan.","bobot":10,"poin":[["Destination Management Organization","Organisasi yang mengoordinasi pihak-pihak yang tidak saling memiliki. Ia jarang punya kewenangan memerintah."],["Destination Management Plan","Dokumen yang menyatakan ke mana destinasi hendak dibawa, oleh siapa, dan dengan ukuran apa."],["Lima model DMO","Government-Led, Public–Private Partnership, Private-Led, Community-Led, dan All-Inclusive Stakeholder-Led. Yang cocok ditentukan konteks destinasi, bukan selera."]],"pustaka":["Pustaka 10 — UU 10/2009 Pasal 7 dan Pasal 28–30","Pustaka 12 — Perda Kepri BAB VI Pasal 48–55; Pasal 24–25","Pustaka 13 — Perda Bintan Pasal 10 dan BAB VII","Pustaka 3 — UNWTO §1.2 hlm. 2–8 dan §1.3 hlm. 9","Pustaka 1 — Morrison Bab 6, 7, dan 8","Pustaka 5 — Buhalis Gambar 1 dan Tabel 2 · Pustaka 9 — GSTC A1, A4, A5, A6, A9","Pustaka 7 — Teguh hlm. 262–264, 266–267, dan 279–282 Tabel 7.14","Pustaka 17 — Bappenas Bab 4 hlm. 105–112 (pembiayaan)"],"alat":"Peta Pemangku Kepentingan Pentahelix","catatan":"Pihak yang ditandai alat sebagai berkepentingan tinggi tetapi berpengaruh rendah hampir selalu masyarakat sekitar. Jadikan temuan itu pembuka diskusi, bukan penutup.","tugas":{"judul":"Dua tugas sekaligus","isi":["Tugas-3 (individu, 800 kata): dasar hukum, struktur, kewenangan, pembiayaan, dan kesenjangan kelembagaan pengelola DTW jangkar. Disertai bagan.","Tugas-4 (kelompok): peta pentahelix, matriks kepentingan-pengaruh, tiga titik potensi konflik, usulan mekanisme koordinasi.","Tugas-4 dipaparkan dalam simulasi forum pemangku kepentingan.","Gunakan GSTC A1, A4, A5, A6, dan A9 sebagai daftar periksa kesenjangan."],"catatan":"Keduanya masuk ke Laporan Milestone 1 minggu depan."},"latihan":[{"bl":4,"s":"Pada matriks kepentingan-pengaruh, sebuah kelompok nelayan yang tanahnya dilewati jalur pengunjung berada di kotak kepentingan tinggi–pengaruh rendah. Tindakan yang tepat adalah","p":["Cukup diberi informasi melalui pengumuman desa","Diberi saluran khusus untuk menyampaikan keberatan","Diabaikan karena pengaruhnya kecil","Diajak hanya bila konflik sudah muncul"],"k":"B","b":"Konflik yang meledak di tahun kelima hampir selalu bisa dilacak ke undangan yang tidak dikirim di tahun pertama. Kotak inilah yang paling sering terlewat."},{"bl":4,"s":"Perbedaan paling mendasar antara sebuah Destination Management Organization dan dinas pariwisata adalah","p":["DMO tidak berbadan hukum","DMO mengoordinasi pihak yang tidak saling memerintah","DMO hanya mengurus promosi","DMO bekerja untuk satu daya tarik saja"],"k":"B","b":"Dinas punya kewenangan formal atas urusannya sendiri. DMO tidak memiliki siapa pun, sehingga kekuatannya bertumpu pada kesepakatan — dan itulah yang membuat pemetaan pemangku kepentingan menjadi pekerjaan pertamanya."},{"bl":4,"s":"Sebuah desa wisata dikelola Pokdarwis dengan semangat tinggi, tetapi pemasarannya lemah dan pembukuannya belum rapi. Menurut Teguh, langkah yang paling tepat adalah","p":["Menyerahkan pengelolaan kepada investor swasta","Berkolaborasi dengan pemerintah, swasta, atau akademisi untuk menutup kesenjangan kapasitas","Menunggu sampai kapasitas internal cukup","Mengubah modelnya menjadi Government-Led"],"k":"B","b":"Model Community-Led unggul pada nilai sosial-budaya tetapi terkendala kapasitas teknis, manajerial, dan akses pasar. Penulis menyebut kolaborasi sebagai kunci keberlanjutannya, bukan penggantian modelnya (hlm. 291)."}]},{"no":5,"mg":"Minggu 8","judul":"Project Milestone 1 — Laporan Audit Situasi Destinasi","sub":"Evaluasi Tengah Semester berbentuk Project Milestone 1: mengukur ketercapaian CPMK-1 dan CPMK-2 melalui Laporan Audit Situasi Destinasi.","ind":["Keterpaduan hasil audit 6A, penentuan posisi TALC, analisis kelembagaan, dan peta pemangku kepentingan dalam satu laporan.","Ketepatan penggunaan konsep dan kerangka analisis pengelolaan destinasi.","Kejelasan penyampaian kemajuan proyek dan tanggapan atas umpan balik."],"bk":"BK-3, BK-4, BK-5, BK-6 — Sintesis materi minggu ke-1 sampai ke-7 dalam bentuk Laporan Audit Situasi Destinasi.","bobot":15,"poin":[["Bukan tugas baru","Laporan ini adalah Tugas-1 sampai Tugas-4 yang disatukan, dirapikan, dan dijadikan satu bacaan yang runtut."],["Yang dinilai: keterpaduan","Apakah temuan audit 6A berbicara dengan temuan kelembagaan. Apakah peta pemangku kepentingan menjelaskan mengapa fasilitas seperti itu kondisinya."],["Bagian yang menentukan","Sintesis situasi: tiga sampai lima masalah pengelolaan paling mendesak, seluruhnya berdasarkan bukti dari bagian sebelumnya."]],"pustaka":["Pustaka 3 — UNWTO §2.1 hlm. 27 dst.","Pustaka 7 — Teguh hlm. 237–244","Pustaka 2 — Ritchie & Crouch Bab 11 hlm. 249–258; hlm. 252, 255; tabel atribut hlm. 257–258","Pustaka 12 — Perda Kepri Pasal 12","Pustaka 13 — Perda Bintan Pasal 12–13 dan Lampiran II","Pustaka 17 — Bappenas hlm. 63 dan hlm. 48–49"],"alat":"Ruang unggah dan rubrik terbuka","catatan":"Umpan balik sejawat tidak dinilai, tetapi wajib diisi. Catatannya dibagikan kepada kelompok yang bersangkutan pada akhir pertemuan.","tugas":{"judul":"Jalannya pertemuan","isi":["Presentasi kemajuan 10 menit per kelompok, tanya jawab 5 menit.","Laporan diunggah ke LMS sebelum kelas dimulai.","Umpan balik diberikan langsung, dicatat kelompok untuk perbaikan.","Bobot 15% — dinilai dengan rubrik D.1 dan butir pertahanan lisan pada D.3."],"catatan":"Laporan menjadi bagian analisis situasi pada dokumen akhir, jadi perbaikan hari ini menghemat pekerjaan di minggu 13–14."},"latihan":[{"bl":5,"s":"Manakah kalimat yang layak masuk bagian temuan Laporan Audit Situasi Destinasi?","p":["Kawasan ini menyimpan potensi luar biasa","Terdapat satu jalur tanpa pagar sepanjang 40 meter di tepi tebing","Pengunjung merasa sangat puas berkunjung ke sini","Destinasi ini layak dikembangkan lebih lanjut"],"k":"B","b":"Temuan bisa diperiksa orang lain dengan cara yang sama. Tiga pilihan lainnya adalah kesan, dan kesan tidak bisa diperdebatkan — karena itu tidak bisa dipakai menyusun program."},{"bl":5,"s":"Sintesis situasi pada laporan seharusnya","p":["Memperkenalkan masalah baru yang belum dibahas","Menyimpulkan bagian-bagian sebelumnya","Mengulang isi profil daya tarik wisata","Berisi usulan program prioritas"],"k":"B","b":"Sintesis yang memperkenalkan masalah baru menandakan bagian sebelumnya belum tuntas. Usulan program adalah pekerjaan minggu 13–14, bukan minggu 8."}]},{"no":6,"mg":"Minggu 9","judul":"Pemasaran, Positioning, dan Branding Destinasi","sub":"Sub-CPMK-6: Menganalisis strategi positioning, image, dan branding destinasi.","ind":["Ketepatan mengidentifikasi positioning dan citra destinasi saat ini.","Ketajaman menganalisis kesesuaian brand dengan sumber daya nyata destinasi.","Kelayakan usulan penajaman positioning."],"bk":"BK-7 — Pemasaran destinasi; positioning, image, dan branding; bauran promosi.","bobot":5,"poin":[["Positioning","Tempat yang ingin ditempati destinasi di benak calon pengunjung, relatif terhadap destinasi lain."],["Image","Yang sebenarnya ada di benak orang — terbentuk dari cerita mulut ke mulut, berita, dan pengalaman, bukan hanya dari iklan."],["Brand","Janji yang dinyatakan destinasi. Merek yang tidak ditopang sumber daya nyata akan runtuh pada kunjungan pertama."]],"pustaka":["Pustaka 14 — Kotler Bab 17 hlm. 507–548 (510–518, 513, 527–535, 536–538)","Pustaka 1 — Morrison Bab 3, 10, 12, dan 13","Pustaka 3 — UNWTO Bab 3 hlm. 41 dst.","Pustaka 2 — Ritchie & Crouch Bab 9 hlm. 183–232","Pustaka 5 — Buhalis §7.1–§7.3 dan Tabel 3","Pustaka 12 Pasal 29–36 · Pustaka 13 BAB V · Pustaka 9 — GSTC A7"],"alat":"Bank materi promosi destinasi","catatan":"Jajak pendapat Mentimeter inilah inti pertemuan: selisih antara yang dibayangkan pemirsa dan yang benar-benar ada di lapangan adalah jarak antara janji dan kenyataan.","tugas":{"judul":"Tugas-5 — Analisis Positioning dan Branding","isi":["Individu, 800 kata. Objek: materi promosi resmi destinasi — situs, media sosial, brosur.","Simpulkan positioning dan citra yang sedang dibangun.","Nilai kesesuaiannya dengan sumber daya nyata yang kalian temukan pada audit 6A.","Usulkan penajaman positioning. Lampirkan bukti materi promosi."],"catatan":"Di sinilah hasil audit minggu 4–5 terbayar. Bandingkan janji dengan temuan."},"latihan":[{"bl":6,"s":"Jajak pendapat menunjukkan pemirsa membayangkan pantai sepi dan air jernih, sementara audit mencatat 12 warung dan satu saluran pembuangan terbuka. Selisih itu paling tepat disikapi dengan","p":["Mengganti foto promosi dengan sudut yang lebih baik","Menjadikannya daftar pekerjaan rumah pengelolaan","Menurunkan intensitas promosi sementara waktu","Menambahkan keterangan bahwa foto hanya ilustrasi"],"k":"B","b":"Selisih antara yang dibayangkan dan yang ada adalah jarak antara janji dan kenyataan. Memperbaiki fotonya hanya memperlebar jarak itu; yang perlu diperbaiki adalah yang di lapangan."},{"bl":6,"s":"Untuk membahas pemasaran digital destinasi, rujukan yang paling tepat dipakai adalah","p":["UNWTO 2007 Bab 4 tentang distribusi","UNWTO 2007 Bab 7 tentang e-business","Morrison Bab 12 tentang digital marketing dan ICT","UNWTO 2007 halaman 26 tentang daftar periksa strategi"],"k":"C","b":"Dua bab UNWTO tentang teknologi sudah lewat zamannya. Yang tetap terpakai dari UNWTO adalah kerangka strategi dan daftar periksanya, bukan bagian teknologinya."}]},{"no":7,"mg":"Minggu 10","judul":"Daya Dukung dan Manajemen Pengunjung","sub":"Sub-CPMK-7: Menganalisis daya dukung dan merumuskan rekomendasi manajemen pengunjung.","ind":["Ketepatan mengestimasi daya dukung fisik daya tarik wisata beserta kejelasan asumsinya.","Ketajaman menganalisis daya dukung ekologis dan sosial.","Kelayakan rekomendasi manajemen pengunjung dan zonasi."],"bk":"BK-8 — Daya dukung fisik, ekologis, dan sosial; manajemen pengunjung dan zonasi.","bobot":6,"poin":[["Daya dukung fisik","Berapa orang yang muat secara nyaman. Dihitung dari luas area efektif, ruang per pengunjung, dan faktor rotasi harian."],["Daya dukung ekologis","Pada jumlah berapa lingkungan mulai rusak. Tandanya: jalur terkikis, vegetasi rusak, perilaku satwa berubah."],["Daya dukung sosial","Pada jumlah berapa penduduk mulai terganggu, dan pada kepadatan berapa pengalaman berkunjung mulai menurun mutunya."]],"pustaka":["Pustaka 2 — Ritchie & Crouch Bab 10 hlm. 246","Pustaka 4 — Cooper Bab 4 (Carrying Capacity)","Pustaka 3 — UNWTO §1.5.3 hlm. 15, §1.9 hlm. 20, Bab 6 mulai hlm. 109","Pustaka 1 — Morrison Bab 9 (Visitor management)","Pustaka 9 — GSTC A8, C6, D2, D3","Pustaka 7 — Teguh hlm. 237–244","Pustaka 13 — Perda Bintan BAB IV Bagian Kelima dan Keenam"],"alat":"Kalkulator Daya Dukung","catatan":"Kolom asumsi sengaja dijadikan syarat. Mahasiswa yang terbiasa langsung mengejar angka akan tertahan di sini, dan itu memang maksudnya.","tugas":{"judul":"Tugas-6 — Perhitungan Daya Dukung","isi":["Individu. Pakai LK-3.","Hitung daya dukung fisik; telaah daya dukung ekologis dan sosial secara kualitatif.","Tentukan mana pembatas yang paling ketat.","Rumuskan tiga rekomendasi manajemen pengunjung dan zonasi — masing-masing menyebut tindakan, pelaksana, dan indikator keberhasilan."],"catatan":"Sandingkan dengan GSTC A8; bila tapaknya alam atau berpenghuni satwa, tambahkan D2 dan D3."},"latihan":[{"bl":7,"s":"Luas total sebuah pantai 4.000 m². Zona lindung 900 m², area berkarang tajam 500 m², dan bagian yang tergenang saat pasang 600 m². Luas area efektifnya adalah","p":["4.000 m²","3.100 m²","2.600 m²","2.000 m²"],"k":"D","b":"4.000 dikurangi 900, 500, dan 600 sama dengan 2.000 m². Penyusutan sebesar separuh luas total itu lazim — dan penyusutan itu sendiri sudah merupakan temuan yang perlu dilaporkan."},{"bl":7,"s":"Sebuah tapak buka pukul 08.00 sampai 17.00 dan lama kunjungan rata-rata hasil pengamatan 90 menit. Faktor rotasi hariannya adalah","p":["1,5","4,5","6,0","9,0"],"k":"C","b":"Jam buka 9 jam dibagi lama kunjungan 1,5 jam sama dengan 6. Lama kunjungan itu harus diamati; bila terpaksa diasumsikan, asumsinya wajib ditulis."}]},{"no":8,"mg":"Minggu 11–12","judul":"Dampak Pariwisata dan Kriteria Keberlanjutan","sub":"Sub-CPMK-8: Mengevaluasi dampak pariwisata dan penerapan prinsip pariwisata berkelanjutan pada daya tarik wisata jangkar.","ind":["Ketepatan menurunkan kriteria evaluasi dari GSTC dan regulasi nasional.","Mutu dan keterverifikasian bukti pendukung penilaian.","Ketajaman menimbang pertukaran kepentingan ekonomi, sosial, dan lingkungan.","Kemampuan mempertahankan penilaian menghadapi sanggahan."],"bk":"BK-8 — Dampak ekonomi, sosial-budaya, dan lingkungan pariwisata; prinsip dan kriteria pariwisata berkelanjutan (GSTC).","bobot":12,"poin":[["Dampak ekonomi","Lapangan kerja, pendapatan rumah tangga, dan kebocoran. Yang menikmati manfaat belum tentu yang menanggung biayanya."],["Dampak sosial-budaya","Perubahan interaksi, efek demonstrasi, dan komodifikasi. Terasa perlahan dan sulit dibalik."],["Dampak lingkungan","Yang paling mudah diukur dan paling sering diabaikan sampai biayanya menjadi mahal."]],"pustaka":["Pustaka 9 — GSTC A3 dan seluruh Bagian B, C, dan D","Pustaka 4 — Cooper Bab 3, 5, dan 6","Pustaka 2 — Ritchie & Crouch Bab 2 hlm. 33–59, khusus hlm. 44–48","Pustaka 3 — UNWTO §1.5 hlm. 12–15","Pustaka 12 — Perda Kepri Pasal 46–47","Pustaka 15 — Morita 2018 (Lagoi dan Desa Sebong Pereh) · Pustaka 16 — Rahayu & Ozali 2024","Pustaka 7 — Teguh hlm. 229–236, 248–251, dan 265","Pustaka 17 — Bappenas hlm. 93–102 dan angka target 2030"],"alat":"Lembar Evaluasi Keberlanjutan GSTC","catatan":"Peringatan \"ada bagian yang belum terwakili\" bukan larangan. Kelompok boleh melanjutkan asal bisa menjelaskan mengapa bagian itu tidak relevan bagi DTW jangkarnya.","tugas":{"judul":"Tugas-7 — Evaluasi Keberlanjutan","isi":["Kelompok, dua pertemuan. Pakai LK-4.","Turunkan sendiri kriteria evaluasi dari GSTC dan regulasi nasional.","Pertahankan hasilnya di forum evaluasi destinasi — tiap kelompok berperan sebagai satu pihak berkepentingan.","Bobot 12%, dinilai dengan rubrik D.2."],"catatan":"Yang dinilai bukan siapa paling keras bersuara, melainkan siapa paling jujur menimbang pertukaran kepentingan."},"latihan":[{"bl":8,"s":"Buku menyebut nilai R² sebesar 0,168 pada satu halaman dan 0,151 pada halaman berikutnya. Yang benar kalian lakukan dalam laporan adalah","p":["Memakai angka yang lebih besar karena lebih meyakinkan","Merata-ratakan keduanya","Mengutip salah satu dengan halamannya dan menyebutkan ketidakkonsistenannya","Tidak memakai angka itu sama sekali"],"k":"C","b":"Menyebutkan ketidakkonsistenan sumber bukan menjelekkan penulisnya; itu justru menunjukkan kalian membaca sampai ke angkanya. Cantumkan halaman supaya pembaca bisa memeriksa sendiri."},{"bl":8,"s":"Kelompok memilih sepuluh kriteria GSTC: enam dari bagian D, tiga dari bagian A, satu dari bagian B. Yang perlu diperbaiki adalah","p":["Jumlahnya, karena melebihi batas","Sebarannya, karena bagian C belum terwakili","Tidak ada, pilihan sudah memenuhi syarat","Urutannya, karena harus dimulai dari bagian A"],"k":"B","b":"Jumlah sepuluh sudah pas. Syaratnya keempat bagian terwakili — dan bagian budaya justru yang paling sering dilewati karena datanya dianggap sulit diukur."},{"bl":8,"s":"Warga mulai mengeluhkan kebisingan dan sulitnya memarkir kendaraan sendiri, padahal hitungan daya dukung fisik masih jauh dari batas. Keadaan itu menunjukkan","p":["Perhitungan daya dukung fisiknya keliru","Batas sosial tercapai lebih dahulu","Warga belum memahami manfaat pariwisata","Perlu penambahan lahan parkir saja"],"k":"B","b":"Batas sosial ditentukan oleh sampai di mana warga masih merasa tempat itu miliknya. Ia hampir tidak pernah dihitung, tercapai lebih dahulu daripada batas fisik, dan paling sering meledak."},{"bl":8,"s":"Sebuah laporan kelompok memasang semua logo SDGs di halaman sampul tanpa menyebut target mana yang diungkit. Menurut Roadmap SDGs Indonesia sendiri, kelemahan utama cara itu adalah","p":["Logonya tidak boleh dipakai tanpa izin","Ketujuh belas tujuan punya daya dorong berbeda, jadi menyebut semua sama dengan belum memilih prioritas","Jumlahnya terlalu banyak untuk satu halaman","SDGs tidak berlaku untuk destinasi wisata"],"k":"B","b":"Analisis keterkaitan menemukan hanya 17 dari 43 target yang berdaya dorong tinggi, dan empat target di tingkat terbawah hierarki justru paling berpengaruh terhadap yang lain (hlm. 99–102). Dokumen itu meminta pembacanya memilih pengungkit, bukan menyebut semuanya.","tag":"sdg"}]},{"no":9,"mg":"Minggu 13–14","judul":"Merancang Rencana Pengelolaan","sub":"Sub-CPMK-9: Merancang dokumen rencana pengelolaan daya tarik wisata terpilih.","ind":["Kelengkapan dan koherensi komponen rencana pengelolaan.","Kelayakan implementasi ditinjau dari sumber daya, waktu, dan kelembagaan di Kepulauan Riau.","Keberpihakan rencana pada kelestarian lingkungan dan kepentingan masyarakat lokal."],"bk":"BK-9 — Perencanaan pengelolaan daya tarik wisata: analisis situasi, tujuan, program prioritas, indikator kinerja (KPI), pembiayaan, dan mitigasi risiko.","bobot":14,"poin":[["Analisis situasi","Bukan bab pembuka basa-basi. Setiap program yang kalian usulkan harus bisa ditunjuk asal masalahnya di bagian ini."],["Program prioritas","Tiga sampai lima, bukan dua puluh. Prioritas berarti memilih, dan memilih berarti ada yang tidak dikerjakan."],["Indikator kinerja","Satu sampai dua per program. Ambil rumusannya dari indikator kinerja GSTC — sudah tersedia, tidak perlu dikarang."]],"pustaka":["Pustaka 3 — UNWTO §1.10 hlm. 25, §1.11 hlm. 26, §2.2–§2.3 hlm. 36 dst.","Pustaka 1 — Morrison Bab 2 (Destination planning)","Pustaka 2 — Ritchie & Crouch Bab 8 hlm. 145–182","Pustaka 6 — Karuniawati 2026, lima pola wisata Langur Bintan","Pustaka 7 — Teguh hlm. 244–245 dan 256–262","Pustaka 9 — GSTC A2, A3, A10, A11","Pustaka 12 Pasal 15–16, 26–27, 56 · Pustaka 13 Pasal 39 dan Bagian Kedelapan","Pustaka 17 — Bappenas hlm. 5 (BAU lawan intervensi)"],"alat":"Daftar Periksa Kelengkapan Dokumen Rencana","catatan":"Riwayat suntingan Google Docs dipakai menilai kriteria kolaborasi. Sampaikan hal ini sejak awal, bukan setelah dokumen selesai.","tugas":{"judul":"Tugas-8 — Draf rencana pengelolaan","isi":["Kelompok, 10–15 halaman. Diserahkan bertahap dalam sesi project coaching.","Analisis situasi diambil dari Laporan Milestone 1 yang sudah diperbaiki, ditambah Tugas-5, 6, dan 7.","Tujuan wajib terukur dan berjangka waktu.","Bobot 14%, dinilai dengan rubrik D.3."],"catatan":"Contoh rancangan yang berangkat dari data lapangan: lima pola wisata Langur Bintan di kawasan Lagoi (Pustaka 6)."},"latihan":[{"bl":9,"s":"Manakah yang merupakan tujuan pengelolaan, bukan program?","p":["Membangun tiga toilet umum pada 2027","Mengadakan pelatihan pemandu dua kali setahun","Kunjungan tidak lagi menumpuk pada dua jam yang sama","Menyusun papan penunjuk di lima titik"],"k":"C","b":"Tujuan menyatakan keadaan yang ingin dicapai; program menyatakan tindakan yang dikerjakan untuk mencapainya. Rencana yang tujuannya berupa daftar kegiatan tidak punya ukuran keberhasilan."},{"bl":9,"s":"Indikator \"meningkatnya kepuasan pengunjung\" belum terukur karena tidak memuat","p":["Nama pihak penanggung jawab","Nilai awal, target, dan cara mengukurnya","Rujukan pada peraturan daerah","Perkiraan pembiayaannya"],"k":"B","b":"Cara mengukur adalah bagian yang paling sering hilang — padahal justru itu yang membuat sebuah rencana tetap berguna setelah masa berlakunya habis."},{"bl":9,"s":"Kelompok menulis \"kunjungan akan naik 20 persen pada 2030\" tanpa menyebut ke mana angka itu bergerak bila tidak ada yang dikerjakan. Bagian yang hilang dari rangka Roadmap SDGs Indonesia adalah","p":["Target 2030","Proyeksi business as usual","Skenario intervensi","Arah kebijakan"],"k":"B","b":"Rangkanya berurutan: kondisi sekarang, proyeksi bila dibiarkan, target, selisih, lalu intervensi yang menutup selisih itu. Tanpa proyeksi business as usual tidak ada selisih yang bisa dihitung — dan tidak ada cara menunjukkan bahwa program kalianlah yang membuat perbedaan.","tag":"sdg"}]},{"no":10,"mg":"Minggu 15","judul":"Mengomunikasikan Rencana kepada Pemangku Kepentingan","sub":"Sub-CPMK-10: Mempresentasikan dan mempertahankan rancangan pengelolaan kepada pemangku kepentingan.","ind":["Kejelasan dan keruntutan penyampaian rencana.","Kekuatan alasan di balik pilihan program yang diusulkan.","Kemampuan menanggapi sanggahan dari sudut pandang pemangku kepentingan yang berbeda."],"bk":"BK-9 — Teknik komunikasi rencana pengelolaan kepada pemangku kepentingan.","bobot":5,"poin":[["Kenali pendengarnya","Pemerintah mencari keselarasan kebijakan. Pengusaha mencari kelayakan. Masyarakat mencari manfaat dan jaminan. Satu paparan harus menjawab ketiganya."],["Pimpin dengan masalah","Bukan dengan profil destinasi. Pendengar sudah tahu tempatnya; yang belum mereka tahu adalah apa yang salah dan apa usul kalian."],["Siapkan asal setiap angka","Pertanyaan yang paling sering menjatuhkan kelompok bukan yang sulit, melainkan: \"Angka ini dari mana?\""]],"pustaka":["Pustaka 3 — UNWTO §1.11 daftar periksa hlm. 26","Pustaka 1 — Morrison Bab 7 dan Bab 11","Pustaka 5 — Buhalis Tabel 2","Pustaka 7 — Teguh hlm. 262–264","Pustaka 12 — Perda Kepri Pasal 60","Pustaka 13 — Perda Bintan Pasal 40"],"alat":"Perekaman latihan dan umpan balik","catatan":"Memutar rekaman sendiri lebih efektif daripada dikoreksi dosen. Sediakan waktu cukup untuk itu.","tugas":{"judul":"Final pitching","isi":["Paparan 10 menit per kelompok, tanggapan 10 menit.","Umpan balik dari dosen dan kelompok lain dicatat untuk perbaikan.","Dokumen diperbaiki dan diserahkan ulang sebelum sidang minggu ke-16.","Bobot 5%."],"catatan":"Perda Kepri Pasal 60 dan Perda Bintan Pasal 40 tentang pengawasan dan pengendalian sering menjadi bahan pertanyaan panel."},"latihan":[{"bl":10,"s":"Sebuah program prioritas tidak bisa dijelaskan manfaatnya bagi masyarakat setempat dalam satu kalimat yang jujur. Langkah berikutnya adalah","p":["Menyusun penjelasan yang lebih meyakinkan","Meninjau ulang programnya","Memindahkannya ke lampiran","Menambahkan data pendukung dari daerah lain"],"k":"B","b":"Kesulitan menjelaskan manfaat biasanya pertanda program itu memang belum bermanfaat, bukan pertanda penjelasnya kurang pandai."},{"bl":10,"s":"Dalam latihan pitching, satu penanya menyerang asumsi daya dukung kelompok. Tanggapan terbaik adalah","p":["Mempertahankan angkanya karena sudah dihitung","Menyebutkan asumsinya dan apa yang akan berubah bila asumsi itu diganti","Mengalihkan pembahasan ke bagian lain","Menyatakan angka itu hanya perkiraan kasar"],"k":"B","b":"Angka yang asumsinya terbuka justru kuat: pihak yang tidak setuju diundang menyerang asumsinya, bukan menyerang orang yang menghitung."}]},{"no":11,"mg":"Minggu 16","judul":"Final Project Defense","sub":"Evaluasi Akhir Semester berbentuk Final Project Defense: mengukur ketercapaian CPMK-3 dan CPMK-4 melalui produk akhir.","ind":["Mutu akhir dokumen Sustainable Destination Management Plan.","Ketepatan penggunaan hasil evaluasi keberlanjutan sebagai dasar penyusunan rencana.","Kemampuan mempertahankan produk secara lisan disertai alasan pengelolaan yang mendasarinya."],"bk":"BK-9 — Sintesis seluruh materi minggu ke-1 sampai ke-15 dalam bentuk dokumen Sustainable Destination Management Plan.","bobot":15,"poin":[["Yang dinilai","Bukan kelancaran berbicara, melainkan apakah setiap keputusan pengelolaan di dalam dokumen bisa dipertanggungjawabkan."],["Rubrik D.3","Kelengkapan dan koherensi rencana · kelayakan implementasi · keberpihakan pada keberlanjutan dan masyarakat lokal · pertahanan lisan. Masing-masing 25%."],["Penilaian perorangan","Setiap anggota wajib mendapat sekurang-kurangnya satu pertanyaan. Nilai pertahanan lisan diberikan perorangan."]],"pustaka":["Pustaka 9 — GSTC, seluruh 38 kriteria dan indikator kinerjanya","Pustaka 3 — UNWTO §1.11 hlm. 26","Pustaka 11 — PP 50/2011","Pustaka 12 — Perda Kepri Pasal 56","Pustaka 13 — Perda Bintan Pasal 39","Pustaka 7 — Teguh hlm. 291","Pustaka 17 — Bappenas hlm. 99–102"],"alat":"Lembar skor dan ruang arsip","catatan":"Mintalah izin kelompok sebelum dokumennya dijadikan contoh untuk angkatan berikutnya.","tugas":{"judul":"Jalannya sidang","isi":["Paparan 15 menit, tanya jawab 15 menit per kelompok.","Panel terdiri atas dosen pengampu dan praktisi industri.","Bobot 15%, dinilai dengan rubrik D.3.","Dokumen final diunggah ke LMS setelah sidang."],"catatan":"Setelah ini, dokumen kalian layak ditunjukkan kepada pengelola DTW yang sebenarnya. Pertimbangkan untuk mengirimkannya."},"latihan":[{"bl":11,"s":"Dokumen kelompok lengkap di delapan butir, tetapi rujukannya hanya menyebut nomor pustaka tanpa halaman atau pasal. Pada sidang, dokumen itu","p":["Diuji seperti biasa","Tidak diuji, karena daftar periksa belum terpenuhi","Diuji dengan pengurangan nilai","Diuji hanya bagian yang rujukannya lengkap"],"k":"B","b":"Kedalaman rujukan adalah salah satu dari sembilan butir daftar periksa. Dokumen tidak lengkap tidak diuji — ketentuan yang disampaikan sejak minggu 13, bukan menjelang sidang."},{"bl":11,"s":"Pada pertahanan lisan, yang paling menentukan nilai adalah","p":["Kerapian bahan tayang","Kemampuan menunjukkan dari mana tiap angka dan pernyataan berasal","Panjang penjelasan tiap anggota","Banyaknya rujukan internasional yang disebut"],"k":"B","b":"Seluruh semester dirancang untuk membangun satu kebiasaan: melihat sendiri, menghitung sendiri, menuliskan asumsinya, dan menyebut sumbernya sampai halaman."}]}],"SOAL":[{"no":1,"bl":1,"rn":"C2","s":"Menurut Pasal 1 UU 10/2009, apa yang membedakan daya tarik wisata dari objek wisata?","p":["Luas wilayahnya","Statusnya sebagai sasaran kunjungan wisatawan","Kepemilikan tanahnya","Jumlah pengunjung per tahun"],"k":"B","b":"Pasal 1 memakai frasa \"menjadi sasaran atau tujuan kunjungan wisatawan\". Selama belum ada yang berniat mendatangkan orang, ia baru sebuah objek."},{"no":2,"bl":1,"rn":"C2","s":"Unsur berikut yang wajib ada pada destinasi pariwisata menurut UU 10/2009 adalah","p":["Hotel berbintang","Masyarakat yang saling terkait","Bandar udara i r yang bisa didatangi"]],"nilai":[["0","Tidak ada, atau ada tetapi tidak berfungsi"],["1","Ada tetapi terbatas, tidak merata, atau tidak terawat"],["2","Ada, berfungsi, dan memadai bagi pola kunjungan sekarang"]],"tafsir":[["10–12","Keenam komponen tertata. Pemeriksaan berlanjut ke mutu, bukan ke keberadaan."],["7–9","Sebagian besar ada. Cari komponen bernilai 0 atau 1 — di situ letak pekerjaan rumahnya."],["4–6","Timpang. Biasanya daya tarik kuat tetapi penopangnya lemah."],["0–3","Belum layak disebut destinasi. Perlakukan sebagai daya tarik tunggal lebih dahulu."]],"catatan":"Angka ini bukan nilai tugas. Ia hanya penunjuk arah pembahasan. Yang dinilai adalah mutu bukti pada kolom ketiga."},{"kode":"AB-2","nama":"Penentu Tahap Siklus Hidup Destinasi","jenis":"centang-tahap","blok":"Minggu 4–5 · Tugas-2","lk":"LK-2","guna":"Menentukan posisi daya tarik wisata jangkar pada tujuh tahap Butler (1980).","cara":"Centang hanya ciri yang kalian punya buktinya. Tahap dengan centang terbanyak adalah dugaan posisinya. Bila dua tahap sama banyak, destinasi itu sedang berpindah tahap — dan itu jawaban yang sah.","tahap":[["Eksplorasi",["Pengunjung sedikit dan datang atas inisiatif sendiri","Belum ada fasilitas yang dibangun khusus untuk wisata","Pola kunjungan tidak teratur sepanjang tahun"]],["Keterlibatan",["Warga setempat mulai menyediakan fasilitas sederhana","Mulai terlihat musim ramai dan musim sepi","Sudah ada promosi meski terbatas"]],["Pembangunan",["Masuk modal dari luar daerah","Fasilitas berskala besar mulai dibangun","Pada puncak musim, jumlah pengunjung mendekati jumlah penduduk"]],["Konsolidasi",["Laju pertumbuhan kunjungan melambat","Ekonomi setempat sangat bergantung pada pariwisata","Sudah terbentuk kawasan usaha wisata yang mapan"]],["Stagnasi",["Jumlah kunjungan mencapai puncak dan berhenti tumbuh","Muncul keluhan lingkungan, sosial, atau ekonomi","Fasilitas sering berpindah tangan pemiliknya"]],["Penurunan",["Jumlah kunjungan menurun beberapa tahun berturut-turut","Fasilitas wisata beralih fungsi ke penggunaan lain","Pengunjung yang tersisa sebagian besar pelancong sehari"]],["Peremajaan",["Ditambahkan daya tarik baru yang benar-benar berbeda","Sumber daya yang selama ini tidak dipakai mulai dimanfaatkan","Datang segmen pasar yang sebelumnya tidak pernah datang"]]],"catatan":"Alat ini sengaja tidak memberi jawaban tunggal ketika bukti terbagi. Itu bukan kerusakan alat, melainkan gambaran destinasi yang memang sedang berpindah tahap."},{"kode":"AB-3","nama":"Peta Pemangku Kepentingan Pentahelix","jenis":"matriks","blok":"Minggu 6–7 · Tugas-3 dan Tugas-4","lk":"LK-5","guna":"Menempatkan tiap pihak pada matriks kepentingan-pengaruh dan menemukan pihak yang paling sering terlewat.","cara":"Tuliskan nama pihak beserta unsur pentahelixnya, lalu beri nilai 1 sampai 5 untuk kepentingan dan 1 sampai 5 untuk pengaruh. Nilai 4 ke atas dianggap tinggi.","kolom":["Nama pihak","Unsur pentahelix","Kepentingan 1–5","Pengaruh 1–5","Kotak"],"unsur":["Pemerintah","Akademisi","Dunia usaha","Masyarakat","Media"],"kotak":[["Kepentingan tinggi · pengaruh tinggi","Ajak sejak awal, libatkan dalam pengambilan keputusan."],["Kepentingan tinggi · pengaruh rendah","Beri saluran khusus. Di sinilah konflik kemudian hari bermula."],["Kepentingan rendah · pengaruh tinggi","Jaga hubungan, beri kabar berkala, jangan sampai menghambat."],["Kepentingan rendah · pengaruh rendah","Cukup diberi informasi."]],"catatan":"Pihak berkepentingan tinggi tetapi berpengaruh rendah hampir selalu masyarakat sekitar. Temuan itu pembuka diskusi, bukan penutupnya."},{"kode":"AB-4","nama":"Kalkulator Daya Dukung","jenis":"hitung","blok":"Minggu 10 · Tugas-6","lk":"LK-3","guna":"Menghitung daya dukung fisik dan memaksa asumsinya dituliskan.","cara":"Isi ketiga variabel beserta asumsinya. Hasil tidak boleh dilaporkan tanpa kolom asumsi terisi.","rumus":"DDF  =  ( A ÷ Au ) × Rf","variabel":[["A","Luas area efektif (m²)","Luas total dikurangi area terlarang, area berbahaya, dan zona lindung. Cantumkan cara mengukurnya."],["Au","Ruang per pengunjung (m²)","Ditetapkan dari jenis kegiatan. Cantumkan dari mana angka ini diambil."],["Rf","Faktor rotasi harian","Jam buka dibagi lama kunjungan rata-rata. Lama kunjungan harus diamati, bukan ditebak."]],"lanjut":[["Daya dukung fisik","Hasil rumus di atas — batas ruang semata."],["Daya dukung ekologis","Turunkan hasil di atas dengan faktor koreksi yang kalian tetapkan sendiri dan pertanggungjawabkan."],["Daya dukung sosial","Diperoleh dari wawancara warga, bukan dari rumus. Biasanya tercapai lebih dahulu."]],"catatan":"Asumsi yang tidak ditulis dianggap tidak ada. Angka tanpa asumsi tidak bisa diperdebatkan, dan karena itu tidak bisa dipakai."},{"kode":"AB-5","nama":"Lembar Evaluasi Keberlanjutan GSTC","jenis":"pilih-kriteria","blok":"Minggu 11–12 · Tugas-7","lk":"LK-4","guna":"Memilih delapan sampai dua belas kriteria GSTC yang benar-benar relevan, dengan keempat bagian terwakili.","cara":"Centang kriteria yang dipilih, salin indikator kinerjanya dari dokumen GSTC, sebutkan pasal regulasi Indonesia yang sejalan bila ada, lalu isi bukti dan penilaian.","bagian":{"A":"Bagian A — Sustainable management","B":"Bagian B — Socio-economic sustainability","C":"Bagian C — Cultural sustainability","D":"Bagian D — Environmental sustainability"},"kriteria":{"A":[["A1","Destination management responsibility"],["A2","Destination management strategy and action plan"],["A3","Monitoring and reporting"],["A4","Enterprise engagement and sustainability standards"],["A5","Resident engagement and feedback"],["A6","Visitor engagement and feedback"],["A7","Promotion and information"],["A8","Managing visitor volumes and activities"],["A9","Planning regulations and development control"],["A10","Climate change adaptation"],["A11","Risk and crisis management"]],"B":[["B1","Measuring the economic contribution of tourism"],["B2","Decent work and career opportunities"],["B3","Supporting local entrepreneurs and fair trade"],["B4","Support for community"],["B5","Preventing exploitation and discrimination"],["B6","Property and user rights"],["B7","Safety and security"],["B8","Access for all"]],"C":[["C1","Protection of cultural assets"],["C2","Cultural artefacts"],["C3","Intangible heritage"],["C4","Traditional access"],["C5","Intellectual property"],["C6","Visitor management at cultural sites"],["C7","Site interpretation"]],"D":[["D1","Protection of sensitive environments"],["D2","Visitor management at natural sites"],["D3","Wildlife interaction"],["D4","Species exploitation and animal welfare"],["D5","Energy conservation"],["D6","Water stewardship"],["D7","Water quality"],["D8","Wastewater"],["D9","Solid waste"],["D10","GHG emissions and climate change mitigation"],["D11","Low-impact transportation"],["D12","Light and noise pollution"]]},"padanan":[["A2","Perda Kepri Pasal 56 dan Perda Bintan Pasal 39 — indikasi program"],["A9","Perda Bintan Pasal 12–13 — kriteria kawasan"],["A8, D2, D3","Perda Kepri Pasal 46–47 — tanggung jawab lingkungan"],["B4","Perda Kepri Pasal 24–25 dan Perda Bintan Bagian Ketujuh — pemberdayaan masyarakat"],["C1–C7","UU 10/2009 Pasal 1 dan Pasal 7"]],"catatan":"Peringatan \"ada bagian yang belum terwakili\" bukan larangan. Kelompok boleh melanjutkan asal bisa menjelaskan mengapa bagian itu tidak relevan bagi daya tarik wisata jangkarnya.","sdgs":{"judul":"Menautkan pilihan kalian ke target nasional","ket":"Edisi GSTC yang dipakai di sini bernama \"with Performance Indicators and SDGs\", jadi tautan ke agenda global sudah ada sejak awal. Yang ditambahkan di bawah ini adalah angka nasionalnya, dari Roadmap SDGs Indonesia (Bappenas, 2019). Pakai sebagai pembanding, bukan sebagai kolom yang harus diisi.","baris":[["A","Tujuan 17 — Kemitraan","Bagian A berbicara tentang siapa yang mengelola dan dengan dana apa. Rasio pajak terhadap PDB ditargetkan naik dari 13,5% tanpa intervensi menjadi 15,1% dengan intervensi pada 2030 (hlm. 88); kebutuhan dana non-pemerintah mencapai USD 1.540 miliar untuk 2025–2030 (hlm. 106)."],["B","Tujuan 8 — Pekerjaan layak dan pertumbuhan","Pertumbuhan PDB riil per kapita ditargetkan 4,4% tanpa intervensi lawan 5,4% dengan intervensi, dan tingkat pengangguran 4,7% lawan 3,8% pada 2030 (hlm. 62–65). Strategi nasionalnya menyebut konektivitas destinasi dan peringkat TTCI (hlm. 63)."],["C","Belum ada indikator nasionalnya","Ringkasan Roadmap tidak memuat indikator kebudayaan di antara 29 indikator terpilihnya. Ini bukan alasan melewatkan Bagian C — justru di sinilah argumen kalian harus bersandar pada GSTC dan pada perda setempat, bukan pada angka nasional. Sebutkan ketiadaan itu secara jujur bila ditanya."],["D","Tujuan 6 dan Tujuan 15","Akses air minum layak 75,75% tanpa intervensi lawan 100% dengan intervensi pada 2030 (hlm. 48–49); tutupan hutan terhadap luas daratan 40% lawan 45,5% (hlm. 84–85)."]],"tutup":"Lalu satu pertanyaan penutup yang akan ditanyakan panel: dari semua kriteria yang kalian pilih, satu atau dua tujuan SDGs mana yang betul-betul diungkit rencana kalian, dan lewat rantai sebab apa? Bappenas sendiri menunjukkan ketujuh belas tujuan punya daya dorong yang berbeda-beda (hlm. 99–102), jadi menyebut semuanya sama saja dengan belum memilih."}},{"kode":"AB-6","nama":"Daftar Periksa Kelengkapan Dokumen Rencana","jenis":"periksa","blok":"Minggu 13–14 dan minggu 16 · Tugas-8","lk":"LK-6","guna":"Memeriksa kelengkapan Dokumen Rencana Pengelolaan sebelum diserahkan dan sebelum sidang.","cara":"Centang sendiri tiap butir. Butir yang belum tercentang adalah pekerjaan yang tersisa. Pada minggu 16, panel memeriksa daftar ini sebelum sidang dimulai.","butir":[["Analisis situasi lengkap","Memuat hasil audit 6A, posisi siklus hidup, dan peta pemangku kepentingan."],["Tujuan pengelolaan","Dirumuskan sebagai keadaan yang ingin dicapai, bukan sebagai kegiatan."],["Program prioritas","Tiap program menyebut tindakan, pelaksana, dan kurun waktunya."],["Indikator kinerja","Tiap indikator memuat nilai awal, target, dan cara mengukurnya."],["Peran pentahelix","Kelima unsur disebut, termasuk yang pengaruhnya rendah."],["Estimasi pembiayaan","Sumber dana disebut, meski masih berupa perkiraan."],["Mitigasi risiko","Merujuk GSTC A11 dan menyebut siapa yang bertindak bila risiko terjadi."],["Rujukan turun sampai halaman atau pasal","Bukan sekadar nomor pustaka."],["Panjang 10–15 halaman","Di luar lampiran."]],"catatan":"Dokumen tidak lengkap tidak diuji. Sampaikan hal ini sejak minggu 13, bukan menjelang sidang."},{"kode":"AB-7","nama":"Pemilih Model Pengelolaan Destinasi","jenis":"model-dmo","blok":"Minggu 6–7 · Tugas-3 dan Tugas-4","lk":"LK-7","guna":"Menentukan model pengelolaan destinasi mana yang sedang berjalan di daya tarik wisata jangkar kalian, menurut lima model Teguh (2026, hlm. 267 dan 291).","cara":"Jawab empat pertanyaan menurut keadaan yang kalian temukan di lapangan, bukan menurut yang seharusnya. Model dengan tanda terbanyak adalah dugaan awal; tuliskan alasannya sendiri.","tanya":[["Siapa yang memegang lahan dan perizinan utamanya?",[["Instansi pemerintah pusat atau daerah","gov"],["Perusahaan swasta lewat konsesi","private"],["Badan usaha bentukan pemerintah dan swasta","ppp"],["Desa atau kelompok masyarakat","community"],["Terbagi banyak pihak tanpa yang dominan","all"]]],["Dari mana modal pembangunannya datang?",[["APBN atau APBD","gov"],["Investasi swasta","private"],["Kerja sama pemerintah dan swasta","ppp"],["Swadaya warga dan dana desa","community"],["Beragam sumber, termasuk hibah dan lembaga non-pemerintah","all"]]],["Siapa yang paling menentukan keputusan sehari-hari?",[["Pejabat instansi pemerintah","gov"],["Manajemen perusahaan pengelola","private"],["Direksi badan usaha bersama","ppp"],["Musyawarah warga atau pengurus kelompok","community"],["Forum lintas pihak yang bersidang berkala","all"]]],["Risiko apa yang paling kalian khawatirkan di tempat ini?",[["Birokrasi lambat dan kurang inovatif","gov"],["Masyarakat sekitar tersisih dari manfaat","private"],["Kepentingan publik terdesak kepentingan komersial","ppp"],["Kapasitas manajerial dan akses pasar terbatas","community"],["Pengambilan keputusan terlalu lambat","all"]]]],"model":{"gov":["Government-Led","Destinasi prioritas nasional atau kawasan yang membutuhkan intervensi besar","Fokus pada kepentingan publik, keberlanjutan, zonasi, infrastruktur, dan konservasi. Contohnya badan otorita seperti BPODT Danau Toba, BOP Borobudur, dan BPOLBF Labuan Bajo."],"ppp":["Public–Private-Led","Destinasi bertaraf internasional berbasis kontrak dan izin investasi","Menggabungkan profesionalisme, efisiensi, dan kepentingan publik. Contohnya ITDC dengan Nusa Dua, Mandalika, dan Golo Mori."],"private":["Private-Led","Resor atau enklave wisata tertentu","Perlu mitigasi risiko sosial dan lingkungan. Contoh yang dipakai penulis adalah Bintan Resorts di Sebong Lagoi — kawasan 18.000–23.000 hektare yang dikelola satu entitas swasta sejak 1990."],"community":["Community-Led","Desa wisata dengan pendekatan partisipatif dan tumbuh dari bawah","Terkendala kapasitas teknis, manajerial, dan akses pasar, sehingga kolaborasi dengan pemerintah, swasta, atau akademisi menjadi kunci keberlanjutan. Contohnya Liya Togo, Penglipuran, Nglanggeran, dan Wae Rebo."],"all":["All-Inclusive Stakeholder-Led","Destinasi kompleks dengan banyak pemangku kepentingan","Menjamin partisipasi luas tanpa meninggalkan pihak mana pun, tetapi keputusannya lebih lambat dan koordinasinya intensif."]},"catatan":"Tidak ada model yang paling benar. Penulis menegaskan bahwa model DMO di Indonesia berkembang sesuai konteks, tujuan, dan karakteristik destinasi (hlm. 291). Yang dinilai bukan ketepatan menebak label, melainkan ketepatan membaca keadaan dan menyebutkan buktinya."}],"LEVEL":[{"n":1,"nama":"Pengamat","req":0,"ket":"Baru mulai melihat. Istilah masih tertukar, dan itu wajar."},{"n":2,"nama":"Pencatat Lapangan","req":130,"ket":"Sudah bisa membedakan temuan dari kesan."},{"n":3,"nama":"Juru Audit","req":310,"ket":"Sudah bisa memeriksa kelengkapan dan menyertakan buktinya."},{"n":4,"nama":"Analis Destinasi","req":530,"ket":"Sudah bisa menghitung, menimbang, dan menuliskan asumsinya."},{"n":5,"nama":"Perancang Rencana","req":760,"ket":"Sudah bisa menyusun program beserta indikator dan penanggung jawabnya."},{"n":6,"nama":"Pengelola Destinasi","req":980,"ket":"Sudah bisa mempertahankan rencana di hadapan pihak yang berbeda kepentingan."}],"LENCANA":[{"id":"mulai","nama":"Langkah Pertama","ket":"Menuntaskan pre-test."},{"id":"jangkar","nama":"Penentu Jangkar","ket":"Menuntaskan Modul 1 dan menetapkan daya tarik wisata jangkar."},{"id":"golong","nama":"Penggolong","ket":"Menuntaskan Modul 2 tentang tipologi dan risiko."},{"id":"audit6a","nama":"Juru Audit 6A","ket":"Mengisi keenam komponen pada simulasi audit dan mendapat nilai sekurang-kurangnya 7."},{"id":"siklus","nama":"Pembaca Siklus","ket":"Menentukan tahap siklus hidup lewat simulasi Butler."},{"id":"pentahelix","nama":"Pemeta Kepentingan","ket":"Menempatkan sekurang-kurangnya lima pihak pada matriks kepentingan-pengaruh."},{"id":"jujur","nama":"Penghitung Jujur","ket":"Menghitung daya dukung dengan kolom asumsi yang terisi."},{"id":"gstc","nama":"Pemilih Kriteria","ket":"Memilih 8–12 kriteria GSTC dengan keempat bagian terwakili."},{"id":"modeldmo","nama":"Pembaca Model","ket":"Menjalankan Pemilih Model Pengelolaan Destinasi sampai muncul dugaan modelnya."},{"id":"rencana","nama":"Juru Rencana","ket":"Menuntaskan Modul 9 tentang penyusunan rencana pengelolaan."},{"id":"kilat","nama":"Kilat","ket":"Meraih sekurang-kurangnya 6 jawaban benar pada Kuis Kilat 60 detik."},{"id":"sebelas","nama":"Tuntas Sebelas","ket":"Menuntaskan seluruh sebelas modul."},{"id":"pengungkit","nama":"Pemilih Pengungkit","ket":"Menjawab benar dua latihan tentang agenda SDGs: memilih prioritas dan menyusun proyeksi."},{"id":"madya","nama":"Ahli Madya","ket":"Meraih nilai post-test 80 ke atas dan mengisi form evaluasi."}],"KASUS":[{"j":"Loket yang tidak pernah dibuka","t":"Sebuah daya tarik wisata punya loket, tetapi petugasnya hanya hadir pada akhir pekan. Hari biasa, pengunjung masuk tanpa membayar dan tanpa tercatat. Apa akibatnya bagi perhitungan daya dukung dan bagi rencana pembiayaan?"},{"j":"Jalan dua kilometer terakhir","t":"Jalan provinsi menuju kawasan mulus, jalan kabupaten lumayan, dua kilometer terakhir rusak dan tidak berpapan. Tidak ada yang merasa berwenang atasnya. Bagaimana kelompok kalian mengangkat persoalan ini ke forum yang tepat?"},{"j":"Tari yang dipendekkan","t":"Pertunjukan yang biasanya berlangsung 40 menit dipendekkan menjadi 12 menit agar sesuai jadwal rombongan. Sanggar setuju karena bayarannya tetap. Kriteria GSTC bagian mana yang tersentuh, dan siapa yang berwenang menolak?"},{"j":"Angka yang tidak ada asumsinya","t":"Sebuah dokumen rencana mencantumkan daya dukung 1.200 orang per hari tanpa menyebut luas efektif maupun lama kunjungan. Apa pertanyaan pertama yang kalian ajukan, dan mengapa angka itu tidak bisa dipakai?"},{"j":"Rapat pada jam kerja","t":"Rapat penyusunan rencana selalu diadakan Selasa pukul 10.00 di ibu kota kabupaten. Warga sekitar tapak tidak pernah hadir. Apa yang akan terjadi pada tahun kelima, dan apa yang bisa diubah sekarang?"},{"j":"Foto yang terlalu bagus","t":"Materi promosi menampilkan pantai sepi berair jernih. Kenyataannya ada 12 warung dan satu saluran pembuangan terbuka. Siapa yang menanggung akibatnya ketika pengunjung datang menagih janji itu?"},{"j":"Perda yang sudah lewat","t":"Rencana induk kabupaten berlaku sampai 2025 dan belum ada penggantinya, sementara kunjungan terus berjalan. Apa yang sebenarnya menopang koordinasi di masa kosong seperti ini?"},{"j":"Peremajaan atau perawatan","t":"Pengelola mengganti nama kawasan, memperbarui akun media sosial, dan memasang gapura baru. Kunjungan tetap datar. Menurut Butler, apa yang sebenarnya belum dikerjakan?"},{"j":"Dua desa yang tertukar","t":"Sebuah laporan memindahkan temuan kajian di Desa Sebong Pereh ke Desa Sebong Lagoi karena letaknya bertetangga. Apa risikonya, dan bagaimana kalian memeriksanya?"},{"j":"Klinik yang tidak ada","t":"Sebuah pulau kecil punya daya tarik alam yang kuat tetapi tidak ada klinik dan sinyal telepon lemah. Siapa saja yang berubah pikiran untuk datang, dan A mana yang sedang bermasalah?"},{"j":"Indikator tanpa alat ukur","t":"Sebuah program menargetkan \"meningkatnya kesejahteraan masyarakat\" tanpa menyebut cara mengukurnya. Bagaimana kalian memperbaikinya tanpa mengubah maksud aslinya?"},{"j":"Enklave yang rapi","t":"Sebuah kawasan resor seluas puluhan ribu hektare dikelola satu entitas swasta: jalannya mulus, pantainya bersih, layanannya bertaraf internasional. Teguh menyebutnya contoh model Private-Led yang berhasil, sekaligus mencatat perlunya mitigasi risiko sosial dan lingkungan. Di kawasan seperti ini, siapa yang kebagian manfaatnya, dan bagaimana kalian memeriksanya?"},{"j":"Dua angka untuk satu model","t":"Satu buku menyebut nilai R² sebesar 0,168 di halaman 231 dan 0,151 di halaman 232 untuk model yang sama. Keterangan satu variabel juga berbeda antara teks dan tabelnya. Apa yang kalian tulis dalam laporan, dan apa yang tidak boleh kalian lakukan?"},{"j":"Logo lengkap, rantai sebab kosong","t":"Satu kelompok memasang seluruh logo SDGs di sampul laporannya dan menulis satu paragraf bahwa destinasinya mendukung pembangunan berkelanjutan. Kelompok lain menyebut satu tujuan saja, lalu menerangkan rantai sebabnya sampai ke rumah tangga mana yang terpengaruh. Mana yang lebih kuat, dan apa alasannya menurut Bab 3 Roadmap SDGs Indonesia?"},{"j":"Kelompok yang berhenti di pagar","t":"Kelompok hanya mengaudit apa yang ada di dalam pagar tapak, lalu menyimpulkan destinasinya sehat. Bagian mana dari batasan Pasal 1 UU 10/2009 yang mereka lewati?"}],"EVALUASI":{"aspek":[["Kejelasan tujuan tiap modul","Saya tahu apa yang harus tercapai sebelum mengerjakan latihannya."],["Kegunaan alat bantu","Simulasi dan lembar kerja membantu saya mengerjakan tugas lapangan."],["Kesesuaian latihan dengan tugas","Latihan di sini mirip dengan yang benar-benar diminta pada tugas."],["Kejelasan rujukan","Saya tahu harus membaca bab, halaman, atau pasal yang mana."],["Kenyamanan pemakaian","Halaman ini mudah dibuka dan dipakai, termasuk dari telepon."]],"skala":["Sangat kurang","Kurang","Cukup","Baik","Sangat baik"],"komitmen":"Satu kebiasaan yang saya mulai pada tugas berikutnya"},"PUSTAKA":["Morrison, A. M. (2019). Marketing and Managing Tourism Destinations (2nd ed.). Abingdon: Routledge.","Ritchie, J. R. B. &amp; Crouch, G. I. (2003). The Competitive Destination. Wallingford: CABI.","World Tourism Organization (2007). A Practical Guide to Tourism Destination Management. Madrid: UNWTO.","Cooper, C. (2022). Essentials of Tourism. London: SAGE.","Buhalis, D. (2000). “Marketing the competitive destination of the future.” Tourism Management 21(1), 97–116.","Karuniawati, E. A. D. (2026). Harmoni di Balik Kanopi. Disertasi. — bacaan wajib.","Teguh, F. (2026). Transformasi Tata Kelola Destinasi Pariwisata. Sleman: Gadjah Mada University Press. — Bab 6–7, hlm. 229–291.","Butler, R. W. (1980). “The concept of a tourist area cycle of evolution.” Canadian Geographer 24(1), 5–12.","Global Sustainable Tourism Council (2019). GSTC Destination Criteria v2.0.","Undang-Undang RI Nomor 10 Tahun 2009 tentang Kepariwisataan.","Peraturan Pemerintah Nomor 50 Tahun 2011 tentang Ripparnas 2010–2025.","Peraturan Daerah Provinsi Kepulauan Riau Nomor 2 Tahun 2012 tentang RIPPARDA 2012–2022.","Peraturan Daerah Kabupaten Bintan Nomor 4 Tahun 2015 tentang RIPPARDA 2015–2025.","Kotler, P. dkk. (2017). Marketing for Hospitality and Tourism (7th ed.). Harlow: Pearson. Bab 17, hlm. 507–548.","Morita, N. (2018). “Pengaruh perkembangan pariwisata Lagoi…” JOM FISIP 5(2), 1–15.","Rahayu, I. &amp; Ozali, I. (2024). “Model pengelolaan wisata bahari berkelanjutan di Kabupaten Bintan.” JESH 6(1), 1–9.","Kementerian PPN/Bappenas (2019). Roadmap of SDGs Indonesia: A Highlight. Jakarta: Bappenas. — Bab 2 Tujuan 6, 8, 11, 15, 17; Bab 3 hlm. 93–102; Bab 4 hlm. 103–112.","Anderson, L. W. &amp; Krathwohl, D. R. (eds.) (2001). A Taxonomy for Learning, Teaching, and Assessing. New York: Longman."]};

const awalS = () => ({
  nama:'', seed: Math.floor(Math.random()*1e9),
  xp:0, pre:null, post:null, kilat:0, roda:false,
  latihan:{},           // "m1-0" -> true bila sudah dijawab
  benar:{},             // "m1-0" -> true bila benar
  sim:{}, alat:{}, lencana:{}, evaluasi:null,
});
let S = awalS();
try { const t = localStorage.getItem(KUNCI_SIMPAN); if (t) S = Object.assign(awalS(), JSON.parse(t)); } catch (x) {}
function simpan(){ try { localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(S)); } catch (x) {} }

/* ── acak dengan benih tetap tiap peserta ── */
function prng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function kocok(arr, benih){ const r=prng(benih), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ── perkakas DOM ── */
const e=(t,k,i)=>{const n=document.createElement(t); if(k)n.className=k; if(i!==undefined)n.innerHTML=i; return n;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const bungkus=t=>{const g=e('div','gulir'); g.appendChild(t); return g;};
function tabelDari(kepala, baris){
  const t=e('table');
  if(kepala){ const tr=e('tr'); kepala.forEach(h=>tr.appendChild(e('th',null,esc(h)))); t.appendChild(e('thead')).appendChild(tr); }
  const tb=e('tbody');
  baris.forEach(r=>{ const tr=e('tr'); r.forEach(c=>tr.appendChild(e('td',null,c))); tb.appendChild(tr); });
  t.appendChild(tb); return bungkus(t);
}
function judulHalaman(kicker, judul, ket){
  const w=e('div');
  w.appendChild(e('div','kicker',esc(kicker)));
  w.appendChild(e('h1',null,esc(judul)));
  w.appendChild(e('div','garis-emas'));
  if(ket) w.appendChild(e('p','redup',esc(ket)));
  return w;
}

/* ── XP, level, lencana ── */
const XP_MAKS = 1180;
function level(){ let L=D.LEVEL[0]; D.LEVEL.forEach(l=>{ if(S.xp>=l.req) L=l; }); return L; }
function levelBerikut(){ return D.LEVEL.find(l=>l.req>S.xp) || null; }
function beriXP(n){ S.xp += Math.max(0, Math.round(n)); simpan(); perbaruiBilah(); }
function beriLencana(id){
  if(S.lencana[id]) return false;
  S.lencana[id]=true; simpan(); kabarkan(D.LENCANA.find(b=>b.id===id).nama); return true;
}
let kabarWadah;
function kabarkan(teks){
  if(!kabarWadah){
    kabarWadah=e('div');
    kabarWadah.style.cssText='position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:.5rem;max-width:min(320px,88vw)';
    document.body.appendChild(kabarWadah);
  }
  const k=e('div',null,'<b>Lencana baru</b><br>'+esc(teks));
  k.style.cssText='background:#1F3864;color:#EFE0AE;border-left:5px solid #C9A227;border-radius:9px;padding:.65rem .85rem;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.28)';
  k.setAttribute('role','status');
  kabarWadah.appendChild(k);
  setTimeout(()=>k.remove(), 5200);
}
function perbaruiBilah(){
  const L=level(), B=levelBerikut();
  document.getElementById('chip-level').innerHTML='Level '+L.n+' · <b>'+esc(L.nama)+'</b>';
  const batas = B ? B.req : XP_MAKS;
  const dasar = L.req;
  const maju = B ? Math.min(100,(S.xp-dasar)/(batas-dasar)*100) : 100;
  document.getElementById('xp-rel').style.width=maju+'%';
  document.getElementById('xp-teks').textContent = B
    ? S.xp+' / '+B.req+' XP menuju '+B.nama
    : S.xp+' XP · pangkat tertinggi';
  gambarNav();
}

/* ── syarat terbuka ── */
const modulTuntas = n => {
  const m=D.MODUL[n-1];
  return m.latihan.every((_,i)=>S.latihan['m'+n+'-'+i]);
};
const semuaModulTuntas = () => D.MODUL.every((_,i)=>modulTuntas(i+1));
function terkunci(id){
  if(id==='pre'||id==='beranda'||id==='aturan'||id==='peta'||id==='pustaka'||id==='lencana') return null;
  if(!S.pre) return 'Selesaikan Pre-Test lebih dahulu.';
  if(/^modul/.test(id)){
    const n=+id.slice(5);
    if(n>1 && !modulTuntas(n-1)) return 'Modul '+(n-1)+' belum tuntas. Modul terbuka berurutan.';
    return null;
  }
  if(id==='post') return semuaModulTuntas()? null : 'Seluruh sebelas modul harus tuntas lebih dahulu.';
  if(id==='evaluasi'||id==='sertifikat') return S.post!==null? null : 'Kerjakan Post-Test lebih dahulu.';
  return null;
}

/* ══ SOAL — komponen bersama ══ */
function blokSoal(q, opts){
  // opts: {kunciId, xpPenuh, langsung (tampilkan pembahasan), onJawab}
  const s=e('div','soal');
  const huruf=['A','B','C','D'];
  const urut=kocok([0,1,2,3], S.seed + (q.no||0)*37 + (opts.kunciId? opts.kunciId.length*11:0));
  s.innerHTML='<div class="tanya">'+esc(q.s)+' <span class="kecil redup">['+(q.rn||'C4')+']</span></div>';
  const sudah = opts.kunciId ? !!S.latihan[opts.kunciId] : false;
  urut.forEach(idx=>{
    const b=e('button','opsi');
    b.type='button';
    const label=huruf[urut.indexOf(idx)];
    b.innerHTML='<b>'+label+'.</b> '+esc(q.p[idx]);
    b.dataset.asli=huruf[idx];
    b.onclick=()=>{
      if(s.dataset.jawab) return;
      s.dataset.jawab='1';
      const betul = huruf[idx]===q.k;
      [...s.querySelectorAll('.opsi')].forEach(x=>{
        x.classList.add('mati');
        if(x.dataset.asli===q.k) x.classList.add('benar');
        else if(x===b) x.classList.add('salah');
      });
      let diberi=0;
      if(!sudah && opts.kunciId){
        diberi = betul ? opts.xpPenuh : Math.round(opts.xpPenuh*0.25);
        S.latihan[opts.kunciId]=true; S.benar[opts.kunciId]=betul; beriXP(diberi); simpan();
      }
      const info=e('div','bahas');
      info.innerHTML='<b>Kunci '+q.k+'.</b> '+esc(q.b)
        + (diberi? ' <span class="xp">+'+diberi+' XP'+(betul?'':' usaha')+'</span>' : (sudah? ' <span class="kecil redup">XP untuk butir ini sudah pernah diberikan.</span>':''));
      s.appendChild(info);
      if(opts.onJawab) opts.onJawab(betul);
    };
    s.appendChild(b);
  });
  if(sudah){
    const info=e('div','bahas');
    info.innerHTML='<b>Sudah dijawab.</b> Kunci '+q.k+'. '+esc(q.b)
      +' <span class="kecil redup">Boleh dicoba lagi untuk belajar, tetapi XP-nya sudah diberikan.</span>';
    s.appendChild(info);
  }
  return s;
}

/* ══ PRE-TEST ══ */
function halamanUjian(jenis){
  const pre = jenis==='pre';
  const jml = pre? 8 : 12;
  const xpTiap = pre? 10 : 15;
  const bank = kocok(D.SOAL, S.seed + (pre?7:13)).slice(0, jml);
  const w=e('div');
  w.appendChild(judulHalaman(pre?'Gerbang pertama':'Gerbang kedua',
    pre?'Pre-Test':'Post-Test',
    pre? jml+' butir. Tidak apa-apa bila banyak yang keliru — inilah gunanya diambil di awal. Menyelesaikannya membuka sebelas modul dan arena latih.'
       : jml+' butir dari bahan yang sama. Menyelesaikannya membuka form evaluasi dan sertifikat.'));

  const nilaiLama = pre? S.pre : S.post;
  if(nilaiLama!==null){
    const k=e('div','kartu ice pita-navy');
    k.innerHTML='<div class="kicker">Sudah dikerjakan</div><div class="hasil">Nilai '+nilaiLama+'</div>'
      +'<p class="kecil redup" style="margin:.2rem 0 0">Soal di bawah boleh dikerjakan lagi untuk belajar, tetapi XP dan nilainya tidak berubah.</p>';
    w.appendChild(k);
  }

  let benar=0, dijawab=0;
  const wadah=e('div');
  bank.forEach((q,i)=>{
    wadah.appendChild(blokSoal(q,{
      kunciId:(pre?'pre-':'post-')+q.no, xpPenuh:xpTiap,
      onJawab:(b)=>{ if(b) benar++; dijawab++; cek(); }
    }));
  });
  w.appendChild(wadah);

  const tutup=e('div','kartu navy pita');
  tutup.innerHTML='<div class="kicker">Hasil</div><div class="hasil" id="uj-hasil" style="color:#fff">Belum selesai</div>'
    +'<div class="bar" style="background:rgba(255,255,255,.18)"><i id="uj-bar"></i></div>'
    +'<p class="kecil" id="uj-ket" style="margin:.2rem 0 0"></p>';
  w.appendChild(tutup);

  function cek(){
    const h=w.querySelector('#uj-hasil'), ket=w.querySelector('#uj-ket');
    w.querySelector('#uj-bar').style.width=(dijawab/jml*100)+'%';
    if(dijawab<jml){ h.textContent='Terjawab '+dijawab+' dari '+jml; ket.textContent='Selesaikan seluruh butir untuk membuka gerbang.'; return; }
    const nilai=Math.round(benar/jml*100);
    h.textContent='Nilai '+nilai+' · benar '+benar+' dari '+jml;
    if(pre){
      if(S.pre===null){ S.pre=nilai; beriLencana('mulai'); }
      ket.textContent='Gerbang terbuka. Sebelas modul dan arena latih kini bisa dibuka dari daftar di kiri.';
    } else {
      if(S.post===null){ S.post=nilai; if(nilai>=80 && S.evaluasi) beriLencana('madya'); }
      ket.textContent = nilai>=80
        ? 'Nilai 80 ke atas. Isi form evaluasi untuk melengkapi lencana Ahli Madya.'
        : 'Form evaluasi dan sertifikat kini terbuka.';
    }
    simpan(); perbaruiBilah(); batalkanSinggahan();
  }
  return w;
}
daftar('pre','Gerbang','Pre-Test',()=>halamanUjian('pre'));

function periksaLencanaSdg(){
  const perlu=[];
  D.MODUL.forEach(m=>m.latihan.forEach((q,i)=>{ if(q.tag==='sdg') perlu.push('m'+m.no+'-'+i); }));
  if(perlu.length && perlu.every(id=>S.benar[id])) beriLencana('pengungkit');
}
function periksaLencanaModul(n){
  if(!modulTuntas(n)) return;
  if(n===1) beriLencana('jangkar');
  if(n===2) beriLencana('golong');
  if(n===9) beriLencana('rencana');
  if(semuaModulTuntas()) beriLencana('sebelas');
  perbaruiBilah();
}
