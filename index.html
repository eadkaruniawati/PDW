daftar('sim2','Arena','Simulasi · Siklus hidup',()=>{
  const w=e('div');
  w.appendChild(judulHalaman('Simulasi · 40 XP','Geser Posisi pada Siklus Hidup',
    'Geser penanda di sepanjang kurva Butler. Tiap tahap menuntut penanganan yang berbeda — itulah sebabnya menentukan tahap lebih dahulu mengubah isi rencana.'));
  const TAHAP=[
    ['Eksplorasi','Pengunjung sedikit dan datang sendiri, belum ada fasilitas khusus wisata.','Catat keadaan awal selagi masih bisa. Data hari ini adalah pembanding sepuluh tahun lagi.'],
    ['Keterlibatan','Warga mulai menyediakan fasilitas sederhana, musim ramai mulai terlihat.','Bantu warga menata sendiri sebelum modal luar menetapkan aturannya.'],
    ['Pembangunan','Modal luar masuk, fasilitas besar dibangun, pengunjung mendekati jumlah penduduk.','Hitung daya dukung sekarang, bukan nanti. Setelah bangunan berdiri, angka itu kehilangan gunanya.'],
    ['Konsolidasi','Pertumbuhan melambat, ekonomi setempat sangat bergantung pada pariwisata.','Periksa siapa yang belum kebagian manfaat. Di sinilah ketimpangan mulai terasa.'],
    ['Stagnasi','Kunjungan berhenti tumbuh, keluhan lingkungan dan sosial bermunculan.','Putuskan arah. Menunda keputusan di tahap ini sama dengan memilih penurunan.'],
    ['Peremajaan','Daya tarik inti benar-benar diubah, segmen pasar baru berdatangan.','Peremajaan menuntut sesuatu yang benar-benar baru. Mengganti nama bukan peremajaan.'],
    ['Penurunan','Kunjungan menurun, fasilitas beralih fungsi ke penggunaan lain.','Pilihannya tinggal dua: menerima fungsi baru kawasan, atau meremajakan dengan sungguh-sungguh.'],
  ];
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 560 300'); svg.setAttribute('class','plot'); svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Kurva siklus hidup destinasi menurut Butler');
  w.appendChild(svg);

  const kendali=e('div','kartu');
  kendali.innerHTML='<label class="kicker" for="tl-geser">Geser waktu</label>';
  const rg=e('input'); rg.type='range'; rg.min=0; rg.max=100; rg.step=1; rg.id='tl-geser';
  rg.value=S.sim.talc!==undefined? S.sim.talc : 20;
  kendali.appendChild(rg);
  const pil=e('div','deret');
  const b1=e('button','tombol kedua','Setelah stagnasi: peremajaan');
  const b2=e('button','tombol kedua','Setelah stagnasi: penurunan');
  b1.type='button'; b2.type='button';
  b1.onclick=()=>{ S.sim.cabang='remaja'; simpan(); gambar(); };
  b2.onclick=()=>{ S.sim.cabang='turun'; simpan(); gambar(); };
  function tandaiCabang(){
    const c=S.sim.cabang||'remaja';
    b1.className='tombol'+(c==='remaja'?'':' kedua');
    b2.className='tombol'+(c==='turun'?'':' kedua');
    b1.setAttribute('aria-pressed', c==='remaja');
    b2.setAttribute('aria-pressed', c==='turun');
  }
  pil.appendChild(b1); pil.appendChild(b2);
  kendali.appendChild(pil);
  w.appendChild(kendali);

  const ket=e('div','kartu navy pita'); ket.id='tl-ket';
  w.appendChild(ket);

  function gambar(){
    const t=+rg.value; S.sim.talc=t; simpan();
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const g=(n,at)=>{const x=document.createElementNS(svgNS,n); for(const k in at) x.setAttribute(k,at[k]); return x;};
    const L=48,B=250,W=440,H=195;
    svg.appendChild(g('line',{x1:L,y1:B-H,x2:L,y2:B,stroke:'#C8D3E2','stroke-width':2}));
    svg.appendChild(g('line',{x1:L,y1:B,x2:L+W+20,y2:B,stroke:'#C8D3E2','stroke-width':2}));
    const tk=(x,y,s,o)=>{const q=g('text',Object.assign({x,y,fill:'#5A6472','font-size':11,'font-family':'Calibri,sans-serif'},o||{})); q.textContent=s; svg.appendChild(q);};
    tk(6,B-H+4,'kunjungan'); tk(L+W-6,B+18,'waktu');
    // kurva pokok sampai stagnasi (0–70), lalu bercabang
    const ty=[0.08,0.2,0.55,0.82,0.9];
    const pokok=[];
    for(let i=0;i<=70;i++){
      const f=i/70, k=f*(ty.length-1), a=Math.floor(k), b=Math.min(ty.length-1,a+1), m=k-a;
      const v=ty[a]+(ty[b]-ty[a])*m;
      pokok.push([L+(W*0.70)*f, B-H*v]);
    }
    svg.appendChild(g('polyline',{points:pokok.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#1F3864','stroke-width':3.2}));
    const P=pokok[pokok.length-1];
    const xe=L+W, yr=P[1]-H*0.20, yt=P[1]+H*0.38;
    const cab=S.sim.cabang||'remaja';
    svg.appendChild(g('line',{x1:P[0],y1:P[1],x2:xe,y2:yr,stroke:'#2F6B44','stroke-width':cab==='remaja'?3.2:2,
      'stroke-dasharray':cab==='remaja'?'':'6 5','opacity':cab==='remaja'?1:.45}));
    svg.appendChild(g('line',{x1:P[0],y1:P[1],x2:xe,y2:yt,stroke:'#A4553A','stroke-width':cab==='turun'?3.2:2,
      'stroke-dasharray':cab==='turun'?'':'6 5','opacity':cab==='turun'?1:.45}));
    tk(xe+4,yr+4,'Peremajaan',{fill:'#2F6B44','font-weight':'bold'});
    tk(xe+4,yt+4,'Penurunan',{fill:'#A4553A','font-weight':'bold'});
    // penanda
    let px,py,tahap;
    if(t<=70){
      const i=Math.round(t/70*70); px=pokok[i][0]; py=pokok[i][1];
      tahap = t<12?0 : t<28?1 : t<48?2 : t<62?3 : 4;
    } else {
      const f=(t-70)/30; px=P[0]+(xe-P[0])*f;
      py = cab==='remaja' ? P[1]+(yr-P[1])*f : P[1]+(yt-P[1])*f;
      tahap = cab==='remaja'?5:6;
    }
    svg.appendChild(g('circle',{cx:px,cy:py,r:8,fill:'#C9A227',stroke:'#1F3864','stroke-width':2.5}));
    // penanda tahap di sumbu
    ['Eksplorasi','Keterlibatan','Pembangunan','Konsolidasi','Stagnasi'].forEach((nm,i)=>{
      const x=L+(W*0.70)*(i/4);
      svg.appendChild(g('line',{x1:x,y1:B,x2:x,y2:B+5,stroke:'#C8D3E2','stroke-width':2}));
      tk(x,B+18,nm,{'text-anchor':'middle','font-size':9.5});
    });
    const T=TAHAP[tahap];
    ket.innerHTML='<div class="kicker">Posisi sekarang</div><div class="hasil" style="color:#fff">'+esc(T[0])+'</div>'
      +'<p style="margin:.25rem 0 .45rem">'+esc(T[1])+'</p>'
      +'<p class="kecil" style="margin:0"><b>Yang perlu dikerjakan pengelola.</b> '+esc(T[2])+'</p>';
    tandaiCabang();
    if(!S.sim.talcxp){ S.sim.talcxp=true; beriXP(40); }
    beriLencana('siklus');
  }
  rg.oninput=gambar;
  setTimeout(gambar,0);
  return w;
});

    /* GSTC */
    const per={}; let jml=0;
    ['A','B','C','D'].forEach(k=>{ per[k]=[...w.querySelectorAll('input[data-g="'+k+'"]:checked')].map(x=>x.value); jml+=per[k].length; });
    w.querySelector('#g-h').textContent=jml+' kriteria';
    const kosong=['A','B','C','D'].filter(k=>!per[k].length);
    let pesan='';
    if(jml===0) pesan='Pilih delapan sampai dua belas kriteria yang benar-benar mengena pada daya tarik wisata jangkar kalian.';
    else{
      pesan='<div class="kecil" style="margin-bottom:.35rem">'+['A','B','C','D'].map(k=>k+': '+(per[k].join(', ')||'—')).join(' &nbsp;|&nbsp; ')+'</div>';
      if(jml<8) pesan+='<b>Masih kurang '+(8-jml)+'.</b>';
      else if(jml>12) pesan+='<b>Kelebihan '+(jml-12)+'.</b> Kemampuan memilih dengan alasan kuat itulah yang dinilai pertama pada rubrik D.2.';
      else pesan+='<b>Jumlahnya sudah pas.</b>';
      if(kosong.length) pesan+=' Bagian '+kosong.join(', ')+' belum terwakili.';
    }
    w.querySelector('#g-k').innerHTML=pesan;
    if(jml>=8&&jml<=12&&!kosong.length){ if(!S.alat.gstcxp){ S.alat.gstcxp=true; beriXP(30); } beriLencana('gstc'); }

    /* daftar periksa */
    const c=w.querySelectorAll('input[data-dp]:checked').length, n=a6.butir.length;
    w.querySelector('#d-h').textContent=c+' dari '+n;
    w.querySelector('#d-bar').style.width=(c/n*100)+'%';
    const kurang=a6.butir.filter((_,i)=>!w.querySelector('[data-dp="'+i+'"]').checked).map(x=>x[0]);
    w.querySelector('#d-k').textContent = c===n? 'Lengkap. Dokumen siap diuji.' : (c? 'Belum lengkap: '+kurang.join('; ')+'.' : 'Centang butir yang sudah ada di dokumen kalian.');
    if(c===n && !S.alat.dpxp){ S.alat.dpxp=true; beriXP(30); }

    /* model DMO */
    const jmlD={};
    a7.tanya.forEach((_,i)=>{
      const r=w.querySelector('input[name="dmo'+i+'"]:checked');
      if(r) jmlD[r.value]=(jmlD[r.value]||0)+1;
    });
    const totalD=Object.values(jmlD).reduce((x,y)=>x+y,0);
    const dh=w.querySelector('#dmo-h'), dk=w.querySelector('#dmo-k');
    if(!totalD){ dh.textContent='Belum ada jawaban'; dk.textContent=''; }
    else{
      const maksD=Math.max(...Object.values(jmlD));
      const puncakD=Object.keys(jmlD).filter(x=>jmlD[x]===maksD);
      dh.textContent=puncakD.map(x=>a7.model[x][0]).join(' / ');
      dk.innerHTML = puncakD.length>1
        ? '<span class="kecil">Dua model atau lebih sama kuat. Itu lazim pada destinasi yang pengelolaannya memang terbagi — tuliskan keduanya beserta buktinya.</span>'
        : '<div class="kecil"><b>Cocok untuk.</b> '+esc(a7.model[puncakD[0]][1])+'<br><b>Catatan penulis.</b> '+esc(a7.model[puncakD[0]][2])+'</div>';
      if(totalD===a7.tanya.length){
        if(!S.alat.dmoxp){ S.alat.dmoxp=true; beriXP(30); }
        beriLencana('modeldmo');
      }
    }
  }
  w.addEventListener('input',hitung); w.addEventListener('change',hitung);
  setTimeout(hitung,0);
  return w;
});

daftar('kilat','Arena','Kuis Kilat 60 detik',()=>{
  const w=e('div');
  w.appendChild(judulHalaman('Arena latih · 10 XP per jawaban benar','Kuis Kilat 60 Detik',
    'Delapan butir, enam puluh detik. XP diberikan sekali, menurut hasil terbaik kalian.'));
  const papan=e('div','kartu navy pita');
  papan.innerHTML='<div class="kicker">Rekam jejak</div><div class="hasil" id="kl-rek" style="color:#fff">Terbaik: '+S.kilat+' dari 8</div>'
    +'<p class="kecil" id="kl-sisa" style="margin:.2rem 0 0">Tekan Mulai bila sudah siap.</p>';
  w.appendChild(papan);
  const d=e('div','deret');
  const bm=e('button','tombol','Mulai'); bm.type='button';
  d.appendChild(bm); w.appendChild(d);
  const arena=e('div'); w.appendChild(arena);

  let sisa=60, timer=null, idx=0, benar=0, bank=[];
  function selesai(){
    clearInterval(timer); timer=null; arena.innerHTML='';
    const k=e('div','kartu krem pita');
    let tambahan=0;
    if(benar>S.kilat){ tambahan=(benar-S.kilat)*10; S.kilat=benar; beriXP(tambahan); }
    if(benar>=6) beriLencana('kilat');
    simpan(); perbaruiBilah();
    k.innerHTML='<div class="kicker">Selesai</div><div class="hasil">'+benar+' dari 8 benar</div>'
      +'<p class="kecil" style="margin:.2rem 0 0">'+(tambahan? 'Rekor baru. <span class="xp">+'+tambahan+' XP</span>' : 'Belum melewati rekor terbaik kalian, jadi XP tidak bertambah.')+'</p>';
    arena.appendChild(k);
    w.querySelector('#kl-rek').textContent='Terbaik: '+S.kilat+' dari 8';
    w.querySelector('#kl-sisa').textContent='Tekan Mulai untuk mencoba lagi.';
    bm.disabled=false; bm.textContent='Ulangi';
  }
  function tampil(){
    if(idx>=bank.length){ selesai(); return; }
    const q=bank[idx];
    arena.innerHTML='';
    const s=e('div','soal');
    s.innerHTML='<div class="kecil redup">Butir '+(idx+1)+' dari 8</div><div class="tanya">'+esc(q.s)+'</div>';
    const huruf=['A','B','C','D'];
    kocok([0,1,2,3], S.seed+q.no*17).forEach((ix,pos)=>{
      const b=e('button','opsi'); b.type='button';
      b.innerHTML='<b>'+huruf[pos]+'.</b> '+esc(q.p[ix]);
      b.onclick=()=>{ if(huruf[ix]===q.k) benar++; idx++; tampil(); };
      s.appendChild(b);
    });
    arena.appendChild(s);
  }
  bm.onclick=()=>{
    bm.disabled=true; sisa=60; idx=0; benar=0;
    bank=kocok(D.SOAL, Date.now()%100000).slice(0,8);
    w.querySelector('#kl-sisa').textContent='Sisa 60 detik';
    tampil();
    timer=setInterval(()=>{
      sisa--;
      const el=w.querySelector('#kl-sisa');
      if(el) el.textContent='Sisa '+sisa+' detik';
      if(sisa<=0) selesai();
    },1000);
  };
  return w;
});

daftar('roda','Arena','Roda Kasus Meja',()=>{
  const w=e('div');
  w.appendChild(judulHalaman('Arena latih · 30 XP sekali','Roda Kasus Meja',
    'Dua belas kasus lapangan untuk dibahas berkelompok. Putar rodanya, lalu bahas sepuluh menit.'));
  const bk=e('div','roda-bungkus');
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 260 260'); svg.setAttribute('class','roda');
  svg.style.cssText='width:min(260px,72vw);height:auto';
  svg.setAttribute('role','img'); svg.setAttribute('aria-label','Roda dua belas kasus');
  const g=(n,at)=>{const x=document.createElementNS(svgNS,n); for(const k in at) x.setAttribute(k,at[k]); return x;};
  const n=D.KASUS.length, R=118, C=130;
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI - Math.PI/2, a1=((i+1)/n)*2*Math.PI - Math.PI/2;
    const p=['M',C,C,'L',C+R*Math.cos(a0),C+R*Math.sin(a0),'A',R,R,0,0,1,C+R*Math.cos(a1),C+R*Math.sin(a1),'Z'].join(' ');
    svg.appendChild(g('path',{d:p,fill:i%2?'#1F3864':'#2C4E7A',stroke:'#FAF5E8','stroke-width':1.5}));
    const am=(a0+a1)/2;
    const t=g('text',{x:C+R*0.68*Math.cos(am),y:C+R*0.68*Math.sin(am),fill:'#EFE0AE','font-size':13,
      'font-family':'Cambria,Georgia,serif','font-weight':'bold','text-anchor':'middle','dominant-baseline':'middle'});
    t.textContent=String(i+1); svg.appendChild(t);
  }
  svg.appendChild(g('circle',{cx:C,cy:C,r:26,fill:'#C9A227',stroke:'#1F3864','stroke-width':3}));
  const kolom=e('div'); kolom.style.cssText='flex:1 1 280px;min-width:240px';
  const kartu=e('div','kartu ice pita-navy'); kartu.id='roda-kartu';
  kartu.innerHTML='<div class="kicker">Belum diputar</div><p style="margin:0">Tekan tombol di bawah untuk memilih satu kasus.</p>';
  const dd=e('div','deret');
  const bp=e('button','tombol','Putar roda'); bp.type='button';
  const bs=e('button','tombol kedua','Sudah dibahas di meja kami'); bs.type='button'; bs.disabled=true;
  dd.appendChild(bp); dd.appendChild(bs);
  kolom.appendChild(kartu); kolom.appendChild(dd);
  const wp=e('div'); wp.style.cssText='position:relative;flex:0 0 auto';
  const jarum=e('div'); jarum.style.cssText='position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid #C9A227';
  wp.appendChild(svg); wp.appendChild(jarum);
  bk.appendChild(wp); bk.appendChild(kolom);
  w.appendChild(bk);

  let putaran=0;
  bp.onclick=()=>{
    const pilih=Math.floor(Math.random()*n);
    putaran += 4 + Math.random()*2;
    const sudutTengah=(pilih+0.5)/n*360;
    svg.style.transform='rotate('+(putaran*360 - sudutTengah)+'deg)';
    bp.disabled=true;
    setTimeout(()=>{
      const k=D.KASUS[pilih];
      kartu.innerHTML='<div class="kicker">Kasus '+(pilih+1)+'</div><h3 style="margin:.1rem 0 .4rem;font-size:1.05rem">'+esc(k.j)+'</h3><p style="margin:0">'+esc(k.t)+'</p>';
      bp.disabled=false; bs.disabled=false;
    }, window.matchMedia('(prefers-reduced-motion:reduce)').matches? 0 : 3500);
  };
  bs.onclick=()=>{
    if(!S.roda){ S.roda=true; beriXP(30); simpan(); }
    bs.disabled=true; bs.textContent='Tercatat';
  };
  if(S.roda){ bs.textContent='Tercatat'; }

  w.appendChild(e('h2',null,'Dua belas kasus'));
  const kisi=e('div','kisi2');
  D.KASUS.forEach((k,i)=>{
    const c=e('div','kartu');
    c.innerHTML='<div class="kicker">Kasus '+(i+1)+'</div><h3 style="margin:.1rem 0 .3rem;font-size:.98rem">'+esc(k.j)+'</h3><p class="kecil" style="margin:0">'+esc(k.t)+'</p>';
    kisi.appendChild(c);
  });
  w.appendChild(kisi);
  return w;
});

/* ── perutean ── */
const utama=document.getElementById('utama');
const nav=document.getElementById('nav');
const singgahan={};
let aktif='beranda';

function batalkanSinggahan(){
  Object.keys(singgahan).forEach(k=>{ if(k!==aktif){ singgahan[k].remove(); delete singgahan[k]; } });
  gambarNav();
  isiStat();
}
function gambarNav(){
  nav.innerHTML='';
  let kel='';
  HALAMAN.forEach(h=>{
    if(h.kel!==kel){ kel=h.kel; nav.appendChild(e('div','kel',kel)); }
    const kunci=terkunci(h.id);
    const b=e('button', (h.id===aktif?'aktif ':'')+(kunci?'terkunci':''));
    b.type='button'; b.dataset.id=h.id;
    let tanda='○';
    if(kunci) tanda='🔒';
    else if(/^modul/.test(h.id) && modulTuntas(+h.id.slice(5))) tanda='✓';
    else if(h.id==='pre' && S.pre!==null) tanda='✓';
    else if(h.id==='post' && S.post!==null) tanda='✓';
    else if(h.id==='evaluasi' && S.evaluasi) tanda='✓';
    b.innerHTML='<span class="tanda">'+tanda+'</span><span>'+esc(h.nama)+'</span>';
    b.onclick=()=>buka(h.id);
    nav.appendChild(b);
  });
}
function buka(id){
  const h=HALAMAN.find(x=>x.id===id);
  if(!h) return buka('beranda');
  aktif=id;
  const kunci=terkunci(id);
  [...utama.children].forEach(c=>c.classList.remove('tampil'));
  if(kunci){
    if(singgahan[id]){ singgahan[id].remove(); delete singgahan[id]; }
    const d=e('div','halaman tampil');
    d.appendChild(judulHalaman('Terkunci', h.nama, null));
    const gt=e('div','gerbang');
    gt.innerHTML='<div class="gembok">🔒</div><h3 style="margin:.5rem 0 .3rem">Belum terbuka</h3><p style="margin:0 0 .9rem">'+esc(kunci)+'</p>';
    const b=e('button','tombol', S.pre===null? 'Mulai Pre-Test' : (id==='post'||id==='evaluasi'||id==='sertifikat'? 'Lihat modul yang tersisa':'Kembali ke Status Anda'));
    b.type='button';
    b.onclick=()=>buka(S.pre===null? 'pre' : 'beranda');
    gt.appendChild(b);
    d.appendChild(gt);
    utama.appendChild(d);
    singgahan[id]=d;
  } else {
    if(!singgahan[id]){
      const d=h.buat(); d.className='halaman'; singgahan[id]=d; utama.appendChild(d);
    }
    singgahan[id].classList.add('tampil');
  }
  gambarNav();
  nav.classList.remove('buka');
  const tn=document.getElementById('tbl-nav');
  if(tn) tn.setAttribute('aria-expanded','false');
  if(id==='beranda') isiStat();
  window.scrollTo(0,0);
  try{ history.replaceState(null,'','#'+id); }catch(x){}
}

const tblNav=document.getElementById('tbl-nav');
tblNav.onclick=()=>{
  const buka=nav.classList.toggle('buka');
  tblNav.setAttribute('aria-expanded', buka);
};
document.getElementById('tbl-atur').onclick=()=>{
  if(!confirm('Hapus seluruh kemajuan di peramban ini dan mulai dari awal?')) return;
  S=awalS(); simpan();
  Object.keys(singgahan).forEach(k=>{ singgahan[k].remove(); delete singgahan[k]; });
  perbaruiBilah(); buka('beranda');
};

perbaruiBilah();
const awal=(location.hash||'').slice(1);
buka(HALAMAN.some(h=>h.id===awal)? awal : 'beranda');
</script>
